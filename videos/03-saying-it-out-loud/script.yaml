# Video 3 of the Uncertainty Explainers: "Saying it out loud".
# Thesis: uncertainty is not communicated until the listener holds the number the
# speaker meant. Pair every word with a number, a reference class, and a statement
# of confidence. Beats follow research/SYNTHESIS.md section (g), video 3; the notes
# are research/notes/06-communicating-uncertainty.md and 07-accounting-and-law.md.
# The ASC 450 wording is quoted by hand from FAS 5 as the PCAOB reprints it [S71]
# (the same definitions stand in ASC 450's glossary, docs/LOCAL-RESOURCES.md §6).
# The NWS "PoP = C x A" formula has no source here and is kept off screen.
slug: 03-saying-it-out-loud
title: Saying it out loud
subtitle: Words, numbers, and the listener
target_seconds: 570
theme: ink
burn_captions: true
voice:
  model: gemini-3.1-flash-tts-preview
  voice: Enceladus
music:
  prompt: >-
    Calm, sparse documentary underscore. Warm felt piano with soft sustained pads,
    slow and reflective, no drums, no melody that competes with a voice.
  gain_db: -14
images:
  - id: folder
    prompt: a closed paper document folder with a single paper clip on its edge
    provider: openai
    quality: medium
  - id: hurricane
    prompt: a hurricane symbol, a round storm eye with two curved spiral arms
    provider: openai
    quality: medium
  - id: raincloud
    prompt: a small rain cloud with three falling rain drops
    provider: openai
    quality: medium
  - id: ledger
    prompt: an open accounting ledger book with ruled columns
    provider: openai
    quality: medium
  - id: gavel
    prompt: a judge's wooden gavel resting beside its round sound block
    provider: openai
    quality: medium
end_card:
  seconds: 5.0
  line: Say the word. Then say the number.
  note: "Uncertainty Explainers · 1 Two kinds of not knowing · 2 From evidence to forecast"
segments:
  # ---------------------------------------------------------------- a fair chance, 1961
  - id: s01
    say: In February 1961, the Joint Chiefs of Staff reviewed a CIA plan to invade Cuba at the Bay of Pigs. Their report came down to one phrase.
    sources: [S67, S68]
    scene:
      name: title_card
      params:
        label: Uncertainty Explainers · 3
        title: Saying it out loud
        subtitle: Words, numbers, and the listener
    hold: 0.6

  - id: s02
    say: 'The report listed the plan''s weak points and then closed with a judgment. The plan, it said, "has a fair chance of ultimate success."'
    sources: [S68]
    transition: dissolve
    beats: [0.0, "fair chance"]
    sfx:
      - cue: paper
        at: 0.0
        gain_db: -8
    scene:
      name: memo
      params:
        stamp: JCSM-57-61 · Joint Chiefs to McNamara · 3 February 1961
        text: Despite the shortcomings pointed out in the assessment, the Joint Chiefs of Staff consider that timely execution of this plan has a fair chance of ultimate success.
        highlight: a fair chance
        image: "image:folder"
        note: ["What the writer meant:", "about 3 in 10,", "a warning"]
        upto: 2
    hold: 0.5

  - id: s03
    say: 'The officer who drafted that line later said the Chiefs put the odds at roughly three in ten. He meant "fair" as a warning, the way a C on a school test means fair work.'
    sources: [S67]
    transition: cut
    beats: [0.0, 0.0, "roughly three in ten"]
    scene:
      name: memo
      params:
        stamp: JCSM-57-61 · Joint Chiefs to McNamara · 3 February 1961
        text: Despite the shortcomings pointed out in the assessment, the Joint Chiefs of Staff consider that timely execution of this plan has a fair chance of ultimate success.
        highlight: a fair chance
        image: "image:folder"
        note: ["What the writer meant:", "about 3 in 10,", "a warning"]
        keep: 2
    hold: 0.5

  - id: s04
    say: Other readers heard approval. The commandant of the Marine Corps said the plan should have accomplished the mission. The CIA quoted the phrase in a paper that argued for the invasion.
    sources: [S67, S69]
    transition: glide
    beats: [0.0, "heard approval"]
    scene:
      name: two_column_compare
      params:
        heading: One phrase, two readings
        left:
          title: The writer
          tone: warn
          lines: ["About 3 chances in 10", "“Fair” as in a C grade: a warning"]
        right:
          title: The readers
          tone: unknown
          lines: ["“Should have accomplished the mission”", "Quoted by the CIA to argue for the plan"]
    hold: 0.5

  - id: s05
    say: President Kennedy came to believe that the Joint Chiefs had endorsed the plan. After the invasion collapsed, he wondered why no one had warned him.
    sources: [S67]
    transition: dissolve
    beats: [0.0, "wondered why"]
    scene:
      name: probability_bar
      params:
        heading: What the President heard
        label: "“a fair chance,” as its writer meant it"
        value: 30
        tone: warn
        note: heard as an endorsement
    hold: 0.6

  - id: s06
    say: The words were true to the writer, and they failed at the other end. Uncertainty is not communicated until the listener holds the number the speaker meant.
    transition: dip
    beats: [0.0, "Uncertainty is not", "until the listener", "the number the speaker"]
    scene:
      name: statement
      params:
        lines: ["True to the writer, lost on the reader.", "Uncertainty is not communicated", "until the listener holds", "the number the speaker meant."]
        highlight: ["the number the speaker meant."]
    hold: 0.7

  # ---------------------------------------------------------------- serious possibility, 1951
  - id: s07
    say: 'Ten years earlier, the same fault had shown up at the CIA. In March 1951, a National Intelligence Estimate, a formal forecast agreed by the intelligence agencies, said a Soviet attack on Yugoslavia "should be considered a serious possibility."'
    sources: [S47]
    transition: dissolve
    scene:
      name: quote_card
      params:
        text: an attack on Yugoslavia in 1951 should be considered a serious possibility.
        who: National Intelligence Estimate 29-51
        when: March 1951
    hold: 0.5

  - id: s08
    say: A few days later, the head of the State Department's planning staff asked Sherman Kent what odds that meant. Kent said about sixty-five to thirty-five in favor of an attack. The planner had read it as much lower.
    sources: [S47]
    transition: glide
    beats: ["sixty-five", "The planner had"]
    sfx:
      - cue: tick
        at: sixty-five
        gain_db: -4
    scene:
      name: phrase_readings
      params:
        phrase: serious possibility
        pins:
          - {value: 65, label: Kent, tone: unknown, up: true, beat: 0}
        zone: {hi: 60, lo: 8, label: "the planner's reading: much lower", beat: 1}
    hold: 0.5

  - id: s09
    say: Kent then asked the members of the Board that had approved the wording, and each had meant different odds. The lowest had meant about twenty in a hundred, and the highest about eighty.
    sources: [S47]
    transition: dissolve
    beats: [0.0, "different odds", "twenty in a hundred", "the highest"]
    scene:
      name: phrase_readings
      params:
        phrase: serious possibility
        pins:
          - {value: 65, label: Kent, tone: unknown, up: true, beat: 0}
          - {value: 20, label: lowest, tone: known, beat: 2}
          - {value: 80, label: highest, tone: known, beat: 3}
        band: {lo: 20, hi: 80, label: the rest ranged in between, beat: 1}
        ghosts: 6
        keep: 1
    hold: 0.5

  - id: s10
    say: They had agreed on a phrase without agreeing on a number. Kent wrote that this shook him more than the failure with the reader.
    sources: [S47]
    transition: dissolve
    beats: [0.0, "without agreeing", "Kent wrote"]
    scene:
      name: statement
      params:
        lines: ["They agreed on a phrase", "without agreeing on a number."]
        highlight: ["without agreeing on a number."]
        note: Sherman Kent, Words of Estimative Probability, 1964
    hold: 0.6

  - id: s11
    say: Kent's answer was a table, in which each word got a number and a margin. Probable meant seventy-five percent, give or take about twelve. Chances about even meant fifty, give or take ten.
    sources: [S47]
    transition: push-left
    beats: [0.0, "Probable meant"]
    scene:
      name: point_ladder
      params:
        heading: Kent's table
        scale: Kent, 1964
        highlight: [Probable, Chances about even]
        rungs:
          - {word: Certainty, p: 100, pm: 0}
          - {word: Almost certain, p: 93, pm: 6}
          - {word: Probable, p: 75, pm: 12}
          - {word: Chances about even, p: 50, pm: 10}
          - {word: Probably not, p: 30, pm: 10}
          - {word: Almost certainly not, p: 7, pm: 5}
          - {word: Impossibility, p: 0, pm: 0}
    hold: 0.5

  - id: s12
    say: Numbers stayed rare. A 2012 study read three hundred seventy-nine declassified estimates and found that only sixteen gave any number for a probability.
    sources: [S66]
    transition: dissolve
    beats: [0.0, "only sixteen"]
    scene:
      name: unit_grid
      params:
        heading: Declassified estimates, 1950s to 2000s
        n: 379
        k: 16
        columns: 26
        label: 16 of 379
        caption: gave any number for a probability
    hold: 0.6

  # ---------------------------------------------------------------- two ladders
  - id: s13
    say: Since 2015, a directive called ICD 203 has told United States intelligence analysts to use one of two fixed ladders, seven words each, tied to ranges. Likely means fifty-five to eighty percent.
    sources: [S50]
    transition: wipe
    direction: Say "ICD 203" as "I C D two oh three".
    scene:
      name: word_ladder
      params:
        heading: US intelligence, ICD 203
        scale: ICD 203
        highlight: likely
        rungs:
          - {word: almost no chance, lo: 1, hi: 5}
          - {word: very unlikely, lo: 5, hi: 20}
          - {word: unlikely, lo: 20, hi: 45}
          - {word: roughly even chance, lo: 45, hi: 55}
          - {word: likely, lo: 55, hi: 80}
          - {word: very likely, lo: 80, hi: 95}
          - {word: almost certain, lo: 95, hi: 99}
    hold: 0.5

  - id: s14
    say: Climate scientists built their own ladder for the Intergovernmental Panel on Climate Change, the IPCC. On that ladder, likely means sixty-six to one hundred percent.
    sources: [S51]
    transition: dissolve
    beats: [0.0, "Climate scientists", "likely means sixty-six"]
    scene: &ladders
      name: two_ladders
      params:
        top: &icd
          scale: ICD 203, intelligence
          rungs:
            - {word: almost no chance, lo: 1, hi: 5}
            - {word: very unlikely, lo: 5, hi: 20}
            - {word: unlikely, lo: 20, hi: 45}
            - {word: roughly even chance, lo: 45, hi: 55}
            - {word: likely, lo: 55, hi: 80}
            - {word: very likely, lo: 80, hi: 95}
            - {word: almost certain, lo: 95, hi: 99}
        bottom: &ipcc
          scale: IPCC, climate
          rungs:
            - {word: exceptionally unlikely, lo: 0, hi: 1}
            - {word: very unlikely, lo: 0, hi: 10}
            - {word: unlikely, lo: 0, hi: 33}
            - {word: about as likely as not, lo: 33, hi: 66}
            - {word: likely, lo: 66, hi: 100}
            - {word: very likely, lo: 90, hi: 100}
            - {word: virtually certain, lo: 99, hi: 100}
        highlight: likely
    hold: 0.5

  - id: s15
    say: So one word carries two meanings. A sixty percent chance is likely to an intelligence analyst, but on the climate ladder it is only about as likely as not.
    sources: [S50, S51]
    transition: cut
    beats: [0.0, 0.0, 0.0, "sixty percent"]
    scene:
      name: two_ladders
      params:
        top: *icd
        bottom: *ipcc
        highlight: likely
        probe: 60
        keep: 3
    hold: 0.5

  - id: s16
    say: The climate ranges also overlap, so anything very likely is also likely. The intelligence ranges sit end to end, and none of them reaches zero or one hundred.
    sources: [S50, S51]
    transition: cut
    beats: [0.0, 0.0, "very likely is also", "intelligence ranges"]
    scene:
      name: two_ladders
      params:
        top: *icd
        bottom: *ipcc
        highlight: very likely
        keep: 2
    hold: 0.6

  # ---------------------------------------------------------------- pulled to the middle; brackets
  - id: s17
    say: Readers bend the words as well. In a 2012 study, Americans read sentences from IPCC reports and gave the number they thought each word stood for.
    sources: [S53]
    transition: push-left
    beats: [0.0]
    scene:
      name: pull_to_middle
      params:
        heading: What readers took the IPCC words to mean
        mean_label: readers' average
        range_label: meant as
        rows:
          - {word: very likely, lo: 90, hi: 100, mean: 62}
          - {word: likely, lo: 66, hi: 100, mean: 54}
          - {word: unlikely, lo: 0, hi: 33, mean: 44}
          - {word: very unlikely, lo: 0, hi: 10, mean: 41}
        upto: 1
    hold: 0.4

  - id: s18
    say: Very likely is meant as ninety percent or more, and on average readers put it at sixty-two. Very unlikely is meant as ten percent or less, and readers put it at forty-one. Both ends were pulled toward the middle.
    sources: [S53, S51]
    transition: cut
    beats: [0.0, "readers put it at sixty-two"]
    scene:
      name: pull_to_middle
      params:
        heading: What readers took the IPCC words to mean
        mean_label: readers' average
        range_label: meant as
        rows:
          - {word: very likely, lo: 90, hi: 100, mean: 62}
          - {word: likely, lo: 66, hi: 100, mean: 54}
          - {word: unlikely, lo: 0, hi: 33, mean: 44}
          - {word: very unlikely, lo: 0, hi: 10, mean: 41}
        keep: 1
    hold: 0.6

  - id: s19
    say: A 2019 study tested fixes for the intelligence ladder with nine hundred twenty-four people. A table of meanings, one click away, barely helped, because only about half the readers ever opened it.
    sources: [S55]
    transition: dissolve
    beats: [0.0, "A table of meanings", "barely helped"]
    scene:
      name: bar_rows
      params:
        heading: Three ways to show the numbers
        note: how far readers' ranges overlapped the official range
        rows:
          - {label: word alone, value: 32, beat: 0}
          - {label: "table, one click away", value: 39, beat: 1}
          - {label: pop-up on hover, value: 40, beat: 2}
    hold: 0.4

  - id: s20
    say: What worked was the number in brackets, inside the sentence. With the word alone, readers' ranges overlapped the official range by about a third. With the bracket beside the word, the overlap was about two thirds.
    sources: [S55]
    transition: glide
    beats: ["in brackets", "about a third", "about two thirds"]
    sfx:
      - cue: soft_click
        at: in brackets
        gain_db: -6
    scene:
      name: bracket_sentence
      params:
        before: X is
        word: very unlikely
        bracket: (05–20%)
        after: to happen.
        results:
          - {label: word alone, value: 32}
          - {label: number in brackets, value: 66}
    hold: 0.7

  # ---------------------------------------------------------------- 30% chance of rain
  - id: s21
    say: Numbers alone are not safe either. A forecast says thirty percent chance of rain tomorrow, and in 2005 researchers asked people in five cities what that means.
    sources: [S60]
    transition: dip
    scene:
      name: rain_readings
      params:
        value: 30
        image: "image:raincloud"
        placeholders: true
        upto: 0
    hold: 0.4

  - id: s22
    say: Many said it would rain thirty percent of the time. Others said it would rain over thirty percent of the area.
    sources: [S60]
    transition: cut
    beats: ["thirty percent of the time", "thirty percent of the area"]
    scene:
      name: rain_readings
      params:
        value: 30
        image: "image:raincloud"
        placeholders: true
        keep: 0
        upto: 2
    hold: 0.4

  - id: s23
    say: 'The weather service means something else: a thirty percent chance that your spot gets at least a hundredth of an inch. Put another way, it rains on about three of every ten days like tomorrow.'
    sources: [S65, S60]
    transition: cut
    beats: [0.0, 0.0, "a thirty percent chance that", "three of every ten days"]
    sfx:
      - cue: chime
        at: three of every ten days
        gain_db: -10
    scene:
      name: rain_readings
      params:
        value: 30
        image: "image:raincloud"
        correct: 2
        placeholders: true
        keep: 2
    hold: 0.5

  - id: s24
    say: In New York, about two thirds of the people asked chose that meaning. In Amsterdam, Berlin, Milan and Athens, only one third to one fifth did.
    sources: [S60]
    transition: dissolve
    beats: [0.0, "In Amsterdam"]
    scene:
      name: bar_rows
      params:
        heading: Who chose "3 of 10 days like this"
        rows:
          - {label: New York, value: 67, text: about 2 in 3, tone: known}
          - {label: "Amsterdam, Berlin, Milan, Athens", lo: 20, hi: 33, text: 1 in 5 to 1 in 3, tone: unknown}
    hold: 0.5

  - id: s25
    say: The missing piece has a name, the reference class. It is the set of cases that a percentage counts over, such as days, hours, or square miles. Until that is said, the number is only half a message.
    sources: [S60, S57]
    transition: dissolve
    beats: [0.0, "such as days", "It is the set"]
    scene:
      name: statement
      params:
        kicker: The reference class
        lines: ["30% of what?", "Days, hours, or square miles."]
        highlight: ["30% of what?"]
        note: "The set of cases a percentage counts over"
    hold: 0.7

  # ---------------------------------------------------------------- the hurricane cone
  - id: s26
    say: Pictures carry the same risk. The National Hurricane Center draws a cone around a storm's forecast track to show where the center of the storm will probably go.
    sources: [S64]
    transition: push-left
    beats: [0.0, "draws a cone"]
    sfx:
      - cue: whoosh
        at: draws a cone
        gain_db: -8
    scene:
      name: charley
      params:
        layers: [line, cone]
        note: Schematic, not to scale
    hold: 0.4

  - id: s27
    say: The cone is built from circles, each sized so that two thirds of past forecast errors fall inside it. So about one time in three, the center leaves the cone. The cone does not show the storm's size.
    sources: [S64, S63]
    transition: cut
    beats: [0.0, 0.0, "built from circles", "one time in three"]
    scene:
      name: charley
      params:
        layers: [line, cone, circles, misses]
        note: Schematic, not to scale
        keep: 2
    hold: 0.5

  - id: s28
    say: In August 2004, the forecast line for Hurricane Charley ran close to Tampa. Charley struck Punta Gorda instead, about seventy miles to the south.
    sources: [S63]
    transition: dissolve
    beats: [0.0, 0.0, "struck Punta Gorda"]
    direction: Say "Punta Gorda" as "POON-tah GOR-dah".
    scene:
      name: charley
      params:
        layers: [line, cone, actual]
        note: Schematic, not to scale
        image: "image:hurricane"
        keep: 2
    hold: 0.5

  - id: s29
    say: Charlotte County, around Punta Gorda, had been inside the cone for four days. Much of the television coverage had pointed viewers at the line.
    sources: [S63]
    transition: cut
    beats: [0.0, 0.0, 0.0, "Charlotte County"]
    direction: Say "Punta Gorda" as "POON-tah GOR-dah".
    scene:
      name: charley
      params:
        layers: [line, cone, actual, county]
        note: Schematic, not to scale
        image: "image:hurricane"
        keep: 3
    hold: 0.5

  - id: s30
    say: In the most exposed evacuation zones around Tampa Bay, fifty-three percent of people left. In the same kind of zone in southwest Florida, including Charlotte County, thirty-one percent did.
    sources: [S63]
    transition: dissolve
    beats: ["fifty-three percent", "thirty-one percent"]
    scene:
      name: bar_rows
      params:
        heading: Evacuated for Charley, most exposed zones
        rows:
          - {label: Tampa Bay, value: 53, tone: known}
          - {label: Southwest Florida, value: 31, tone: warn}
    hold: 0.5

  - id: s31
    say: 'The director of the hurricane center, Max Mayfield, later joked about the words for his tombstone: "Don''t focus on the skinny black line."'
    sources: [S63]
    transition: dissolve
    scene:
      name: quote_card
      params:
        text: Don't focus on the skinny black line.
        who: Max Mayfield, National Hurricane Center
        when: on the words for his tombstone
    hold: 0.7

  # ---------------------------------------------------------------- 2016
  - id: s32
    say: A probability can be right and still feel wrong. In its final forecast of the 2016 election, FiveThirtyEight gave Donald Trump about a twenty-nine percent chance of winning.
    sources: [S62]
    transition: push-left
    beats: ["FiveThirtyEight gave"]
    direction: Say "FiveThirtyEight" as "five thirty-eight".
    scene:
      name: bar_rows
      params:
        heading: Trump's chance, final forecasts, 8 November 2016
        rows: &models
          - {label: FiveThirtyEight, value: 29, tone: unknown, beat: 0}
          - {label: other model, value: 15, beat: 1}
          - {label: other model, value: 8, beat: 2}
          - {label: other model, value: 2, beat: 3}
          - {label: other model, value: 0.6, text: under 1%, beat: 4}
        upto: 1
    hold: 0.4

  - id: s33
    say: Other models gave him fifteen percent, eight, two, and less than one. FiveThirtyEight's line was seventy-one for Hillary Clinton against twenty-nine for Trump.
    sources: [S62, S61]
    transition: cut
    beats: [0.0, "fifteen percent", "eight", "two, and", "less than one"]
    direction: Say "FiveThirtyEight" as "five thirty-eight".
    scene:
      name: bar_rows
      params:
        heading: Trump's chance, final forecasts, 8 November 2016
        rows: *models
        keep: 1
    hold: 0.5

  - id: s34
    say: Twenty-nine in a hundred is not small. It is more than one chance in four, and events with those odds happen all the time.
    sources: [S62]
    transition: dissolve
    beats: [0.0, "more than one chance"]
    sfx:
      - cue: tick
        at: happen all the time
        gain_db: -6
    scene:
      name: unit_grid
      params:
        heading: 29 in 100
        n: 100
        k: 29
        columns: 10
        label: 29 of 100
        caption: each square one draw of a 29% chance; the outline is this draw
        pick: true
    hold: 0.6

  - id: s35
    say: Three days after the vote, Nate Silver wrote that "people mistake having a large volume of polling data for eliminating uncertainty."
    sources: [S62]
    transition: dissolve
    scene:
      name: quote_card
      params:
        text: people mistake having a large volume of polling data for eliminating uncertainty.
        who: Nate Silver, FiveThirtyEight
        when: 11 November 2016
    hold: 0.5

  - id: s36
    say: A single result cannot prove a probability right or wrong. Many forecasts, scored against what happened, can.
    sources: [S33, S34]
    transition: dissolve
    beats: [0.0, "Many forecasts"]
    scene:
      name: statement
      params:
        lines: ["One result proves nothing.", "Many forecasts, scored, can."]
        highlight: ["Many forecasts, scored, can."]
    hold: 0.8

  # ---------------------------------------------------------------- the accountant's and the court's ladders
  - id: s37
    say: Accountants and courts face the same problem, and they answer with words too. Under the accounting rule for losses, now called ASC 450, a loss is probable, reasonably possible, or remote.
    sources: [S71, S70]
    transition: push-up
    beats: ["Under the accounting rule"]
    direction: Say "ASC 450" as "A S C four fifty".
    sfx:
      - cue: paper
        at: ASC 450
        gain_db: -10
    scene:
      name: action_ladder
      params:
        scale: ASC 450 (FAS 5), losses
        image: "image:ledger"
        rungs: &asc
          - {word: Probable, gloss: "“likely to occur”", action: book it}
          - {word: Reasonably possible, gloss: "“more than remote but less than likely”", action: tell readers}
          - {word: Remote, gloss: "“slight”", action: nothing}
        upto: 1
    hold: 0.4

  - id: s38
    say: 'The rule defines each word only with other words. Probable means likely to occur, and remote means slight. Reasonably possible sits between: more than remote, but less than likely.'
    sources: [S71]
    transition: cut
    beats: [0.0, "Probable means"]
    scene:
      name: action_ladder
      params:
        scale: ASC 450 (FAS 5), losses
        image: "image:ledger"
        rungs: *asc
        keep: 1
        upto: 2
    hold: 0.4

  - id: s39
    say: Each word sets an action. A probable loss that can be estimated goes into the accounts, and a reasonably possible loss gets a note to readers. A remote loss needs neither.
    sources: [S71, S70]
    transition: cut
    beats: [0.0, 0.0, "A probable loss"]
    scene:
      name: action_ladder
      params:
        scale: ASC 450 (FAS 5), losses
        image: "image:ledger"
        rungs: *asc
        keep: 2
    hold: 0.5

  - id: s40
    say: The tax rule is the exception. A company books the largest tax benefit that is greater than fifty percent likely to be realized, a number stated outright.
    sources: [S73]
    transition: dissolve
    scene:
      name: probability_bar
      params:
        heading: The tax rule, FIN 48 (now ASC 740)
        label: "“greater than 50 percent likely”"
        value: 50
        band: [50, 100]
        band_label: more than 50%
        tone: unknown
        note: a number, stated outright
    hold: 0.5

  - id: s41
    say: Courts have a ladder too. In Addington against Texas, in 1979, the Supreme Court described three standards of proof. A standard of proof says how sure the fact finder must be.
    sources: [S75]
    transition: push-left
    beats: [0.0]
    scene:
      name: risk_seesaw
      params:
        heading: Addington v. Texas, 1979
        image: "image:gavel"
        left: the side that brings the case
        right: the other side
        levels: &levels
          - {name: Preponderance of the evidence, share: 0.5, note: share the risk of error roughly equally}
          - {name: Beyond a reasonable doubt, share: 0.93, note: almost all the risk of error on society}
          - {name: Clear and convincing evidence, share: 0.72, note: in between}
        upto: 1
    hold: 0.4

  - id: s42
    say: In a money dispute, the standard is a preponderance of the evidence, and the two sides share the risk of a wrong decision in roughly equal fashion.
    sources: [S75]
    transition: cut
    beats: [0.0]
    scene:
      name: risk_seesaw
      params:
        heading: Addington v. Texas, 1979
        image: "image:gavel"
        left: the side that brings the case
        right: the other side
        levels: *levels
        keep: 1
        upto: 1
    hold: 0.4

  - id: s43
    say: In a criminal case, the proof must be beyond a reasonable doubt, and society takes almost the entire risk of error upon itself. Clear and convincing evidence sits between the two.
    sources: [S75]
    transition: cut
    beats: [0.0, "beyond a reasonable doubt", "Clear and convincing"]
    scene:
      name: risk_seesaw
      params:
        heading: Addington v. Texas, 1979
        image: "image:gavel"
        left: the side that brings the case
        right: the other side
        levels: *levels
        keep: 1
    hold: 0.5

  - id: s44
    say: 'The Court put no numbers on these phrases. It said that the truth about how they shape decisions "may well be unknowable."'
    sources: [S75]
    transition: dissolve
    scene:
      name: quote_card
      params:
        text: the ultimate truth as to how the standards of proof affect decisionmaking may well be unknowable
        who: Addington v. Texas, US Supreme Court
        when: "1979"
    hold: 0.7

  # ---------------------------------------------------------------- van der Bles's checklist
  - id: s45
    say: 'In 2019, Anne Marthe van der Bles and her colleagues set out what a statement of uncertainty should contain. Start with what you are unsure about: a fact, a number, or a scientific claim.'
    sources: [S56]
    transition: push-up
    beats: ["Start with what"]
    direction: Say "van der Bles" as "fahn der BLESS".
    scene:
      name: checklist
      params:
        heading: What to say, after van der Bles and colleagues, 2019
        items:
          - {title: What you are unsure about, detail: "a fact, a number, or a scientific claim"}
          - {title: In what form, detail: "a range, a probability, or a word"}
          - {title: How good the evidence is, detail: "the confidence behind it"}
        upto: 1
    hold: 0.4

  - id: s46
    say: Then pick a form, such as a range, a probability, or a word. Then say how good the evidence is. The IPCC calls this confidence, rated by how much evidence there is and how closely findings agree.
    sources: [S56, S51]
    transition: cut
    beats: ["Then pick a form", "how good the evidence"]
    scene:
      name: checklist
      params:
        heading: What to say, after van der Bles and colleagues, 2019
        done: 1
        items:
          - {title: What you are unsure about, detail: "a fact, a number, or a scientific claim"}
          - {title: In what form, detail: "a range, a probability, or a word"}
          - {title: How good the evidence is, detail: "the confidence behind it"}
    hold: 0.4

  - id: s47
    say: Confidence is not a probability, and the intelligence directive keeps the two apart. A likelihood and a confidence level may not appear in the same sentence.
    sources: [S51, S50]
    transition: dissolve
    beats: [0.0, "keeps the two apart", "may not appear", "same sentence"]
    scene:
      name: confidence_grid
      params:
        heading: Confidence is a separate scale
        mark: [1, 1]
        likelihood: likely (55–80%)
        separate: true
    hold: 0.5

  - id: s48
    say: Put together, a full statement reads like this. Rain tomorrow is likely, fifty-five to eighty percent, counted over days like tomorrow at this spot. Our confidence in that range is medium.
    transition: dissolve
    beats: ["Rain tomorrow", "fifty-five to eighty", "counted over days", "Our confidence"]
    scene:
      name: sentence_builder
      params:
        label: An example
        parts:
          - {text: Rain tomorrow is likely, tag: the word}
          - {text: "(55–80%),", tag: the number, mono: true}
          - {text: counted over days like tomorrow at this spot., tag: the reference class}
          - {text: "Confidence in that range: medium.", tag: the evidence, newline: true}
    hold: 0.7

