  - id: s50
    say: 'Warn that one result cannot test the forecast. Keep word scales when they guide action. Then state how strongly the evidence supports the claim.'
    transition: cut
    scene: *summary
    hold: 0.6

  - id: s51
    say: Where did seven chances in ten disappear? They vanished inside the phrase fair chance. The report gave no number, no comparison group, and no account of the evidence's strength.
    transition: dip
    beats: [0.0, 0.0, "vanished inside"]
    scene:
      name: memo
      params:
        stamp: JCSM-57-61 · 3 February 1961
        text: *memo_text
