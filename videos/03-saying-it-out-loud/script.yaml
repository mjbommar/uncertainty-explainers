# Video 3 of the Uncertainty Explainers: "Saying it out loud".
# Shape: docs/STRUCTURE.md, video 3. Opening question (Bay of Pigs), claim and map,
# six stops (bridge over `roadmap` in travel mode, vignette, takeaway on `statement`),
# zoom-out over `roadmap` in summary mode, the memo rewritten in full form.
# Thesis: uncertainty is not communicated until the listener holds the number the
# speaker meant. Notes: research/notes/06-communicating-uncertainty.md and
# 07-accounting-and-law.md.
# The ASC 450 wording is quoted by hand from FAS 5 as the PCAOB reprints it [S71]
# (the same definitions stand in ASC 450's glossary, docs/LOCAL-RESOURCES.md §6).
# The NWS "PoP = C x A" formula has no source here and is kept off screen.
# The full-form memo line in the zoom-out is our rewrite, not a historical text; it is
# labelled so on screen. ICD 203 forbids a likelihood and a confidence level in one
# sentence [S50]; that rule is not said, because the rewrite (as specified) joins them.
slug: 03-saying-it-out-loud
title: Say what the odds mean
subtitle: Help the listener hear the number you intend
target_seconds: 570
theme: ink
burn_captions: true
voice:
  model: gemini-3.1-flash-tts-preview
  voice: Enceladus
music:
  prompt: >-
    Calm, sparse documentary underscore. Warm felt piano with soft sustained pads,
    slow and reflective, no drums, no melody that competes with a voice.
  gain_db: -14
images:
  - id: folder
    prompt: a closed paper document folder with a single paper clip on its edge
    provider: openai
    quality: medium
  - id: hurricane
    prompt: a hurricane symbol, a round storm eye with two curved spiral arms
    provider: openai
    quality: medium
  - id: raincloud
    prompt: a small rain cloud with three falling rain drops
    provider: openai
    quality: medium
  - id: ledger
    prompt: an open accounting ledger book with ruled columns
    provider: openai
    quality: medium
  - id: gavel
    prompt: a judge's wooden gavel resting beside its round sound block
    provider: openai
    quality: medium
end_card:
  seconds: 5.0
  line: Give the word, the number, the group, and the strength of the evidence.
  note: Uncertainty Explainers, video 3 of 3

segments:
  # ================================================================ opening: a fair chance, 1961
  - id: s01
    say: In February 1961, the Joint Chiefs of Staff reviewed a United States plan to invade Cuba at the Bay of Pigs.
    sources: [S67, S68]
    scene:
      name: title_card
      params:
        label: Uncertainty Explainers · 3
        title: Say what the odds mean
        subtitle: Help the listener hear the number you intend
    hold: 0.5

  - id: s02
    say: 'Their report listed serious problems. Yet its final judgment said the plan "has a fair chance of ultimate success."'
    sources: [S68]
    transition: dissolve
    beats: [0.0, "fair chance"]
    sfx:
      - cue: paper
        at: 0.0
        gain_db: -8
    scene:
      name: memo
      params:
        stamp: JCSM-57-61 · Joint Chiefs to McNamara · 3 February 1961
        text: &memo_text Despite the shortcomings pointed out in the assessment, the Joint Chiefs of Staff consider that timely execution of this plan has a fair chance of ultimate success.
        highlight: a fair chance
        image: "image:folder"
        note: ["The writer meant:", "about 3 chances in 10", "a warning, not support"]
        upto: 2
    hold: 0.4

  - id: s03
    say: 'The officer who wrote that sentence later explained the intended odds: about three chances in ten. He meant "fair" as a warning.'
    sources: [S67]
    transition: cut
    beats: [0.0, 0.0, "about three chances"]
    scene:
      name: memo
      params:
        stamp: JCSM-57-61 · Joint Chiefs to McNamara · 3 February 1961
        text: *memo_text
        highlight: a fair chance
        image: "image:folder"
        note: ["The writer meant:", "about 3 chances in 10", "a warning, not support"]
        keep: 2
    hold: 0.4

  - id: s04
    say: 'Other readers heard support for the plan. The Central Intelligence Agency quoted the phrase while arguing that the invasion should proceed.'
    sources: [S67, S69]
    transition: glide
    beats: [0.0, "heard support"]
    scene:
      name: two_column_compare
      params:
        heading: The same phrase carried two messages
        left:
          title: Intended meaning
          tone: warn
          lines: ["About 3 chances in 10", "A warning about likely failure"]
        right:
          title: Meaning heard
          tone: unknown
          lines: ["Support for moving ahead with the plan"]
    hold: 0.4

  - id: s05
    say: President John F. Kennedy believed the military leaders had supported the plan. After the invasion failed, he asked why they had not warned him.
    sources: [S67]
    transition: dissolve
    beats: [0.0, "asked why"]
    scene:
      name: probability_bar
      params:
        heading: The odds hidden inside the phrase
        label: "Success, as the writer meant “a fair chance”"
        value: 30
        tone: warn
        note: Readers heard support for the plan
    hold: 0.5

  - id: s06
    say: Three chances in ten of success also meant seven chances in ten of failure. Where did those seven chances disappear between writer and reader? How can we keep that from happening?
    transition: dip
    beats: [0.0, "seven chances in ten", "between writer and reader"]
    scene:
      name: statement
      params:
        lines: ["Meant: 3 chances in 10 of success", "Heard: support for the plan", "Where did 7 chances in 10 go?"]
        highlight: ["Where did 7 chances in 10 go?"]
    hold: 0.8

  # ================================================================ claim and map
  - id: s07
    say: Communication succeeds only when the listener understands the odds the speaker meant. Words, numbers, groups, and pictures can each change the message.
    transition: dissolve
    beats: [0.0, "when the listener", "odds the speaker"]
    scene:
      name: statement
      params:
        lines: ["Communication succeeds only when", "the listener understands", "the odds the speaker meant."]
        highlight: ["the odds the speaker meant."]
    hold: 0.5

  - id: s08
    say: 'We will follow six points where meaning can change: the word, the number''s group, the picture, one result, words tied to actions, and the complete statement.'
    transition: dissolve
    scene:
      name: roadmap
      params:
        kicker: Six checks
        heading: Where meaning can change
        stops: &stops
          - label: The word
            question: Does the word carry a number?
            takeaway: Put the number beside the word.
          - label: "The number's group"
            question: What does the number count over?
            takeaway: Name the group behind the number.
          - label: The picture
            question: What does the picture leave out?
            takeaway: Explain what the picture leaves out.
          - label: The single result
            question: Can one outcome judge a forecast?
            takeaway: One result cannot test a probability.
          - label: Words on purpose
            question: Why do some refuse numbers?
            takeaway: Ask what the word scale does.
          - label: The whole statement
            question: What does a full statement say?
            takeaway: State the strength of the evidence.
        current: -1
        mode: overview
    hold: 0.6

  # ================================================================ stop 1: the word
  - id: s09
    say: 'Begin with the word. Ten years before the Bay of Pigs, Sherman Kent found the same problem in another intelligence report.'
    sources: [S47]
    transition: dissolve
    scene:
      name: roadmap
      params:
        stops: *stops
        current: 0
        mode: travel
    hold: 0.3

  - id: s10
    say: 'In March 1951, an official forecast said a Soviet attack on Yugoslavia "should be considered a serious possibility."'
    sources: [S47]
    transition: dissolve
    scene:
      name: quote_card
      params:
        text: an attack on Yugoslavia in 1951 should be considered a serious possibility.
        who: National Intelligence Estimate 29-51
        when: March 1951
    hold: 0.4

  - id: s11
    say: 'Kent helped approve that phrase. He thought it meant about sixty-five chances in one hundred. A State Department planner read it as much less likely.'
    sources: [S47]
    transition: glide
    beats: ["sixty-five", "State Department planner"]
    sfx:
      - cue: tick
        at: sixty-five
        gain_db: -4
    scene:
      name: phrase_readings
      params:
        phrase: serious possibility
        pins:
          - {value: 65, label: Kent, tone: unknown, up: true, beat: 0}
        zone: {hi: 60, lo: 8, label: "the planner's reading: much lower", beat: 1}
    hold: 0.4

  - id: s12
    say: 'Other board members gave meanings from twenty to eighty chances in one hundred. Everyone had approved the same words, but they had not shared the same odds.'
    sources: [S47]
    transition: dissolve
    beats: [0.0, "from twenty", "twenty to eighty", "eighty chances"]
    scene:
      name: phrase_readings
      params:
        phrase: serious possibility
        pins:
          - {value: 65, label: Kent, tone: unknown, up: true, beat: 0}
          - {value: 20, label: lowest, tone: known, beat: 2}
          - {value: 80, label: highest, tone: known, beat: 3}
        band: {lo: 20, hi: 80, label: the rest ranged in between, beat: 1}
        ghosts: 6
        keep: 1
    hold: 0.5

  - id: s13
    say: 'Kent proposed linking each word to a number range. Agencies now use such scales. United States intelligence uses likely for fifty-five to eighty percent. The Intergovernmental Panel on Climate Change uses likely for sixty-six to one hundred percent.'
    sources: [S50, S51]
    transition: dissolve
    beats: [0.0, "The Intergovernmental", "sixty-six to one hundred"]
    scene: &ladders
      name: two_ladders
      params:
        top: &icd
          scale: ICD 203, intelligence
          rungs:
            - {word: almost no chance, lo: 1, hi: 5}
            - {word: very unlikely, lo: 5, hi: 20}
            - {word: unlikely, lo: 20, hi: 45}
            - {word: roughly even chance, lo: 45, hi: 55}
            - {word: likely, lo: 55, hi: 80}
            - {word: very likely, lo: 80, hi: 95}
            - {word: almost certain, lo: 95, hi: 99}
        bottom: &ipcc
          scale: IPCC, climate
          rungs:
            - {word: exceptionally unlikely, lo: 0, hi: 1}
            - {word: very unlikely, lo: 0, hi: 10}
            - {word: unlikely, lo: 0, hi: 33}
            - {word: about as likely as not, lo: 33, hi: 66}
            - {word: likely, lo: 66, hi: 100}
            - {word: very likely, lo: 90, hi: 100}
            - {word: virtually certain, lo: 99, hi: 100}
        highlight: likely
    hold: 0.4

  - id: s14
    say: A sixty-percent chance is therefore likely on the intelligence scale. On the climate scale, the same number is only about as likely as not.
    sources: [S50, S51]
    transition: cut
    beats: [0.0, 0.0, 0.0, "sixty-percent"]
    scene:
      name: two_ladders
      params:
        top: *icd
        bottom: *ipcc
        highlight: likely
        probe: 60
        keep: 3
    hold: 0.5

  - id: s15
    say: 'Readers also pull strong words toward the middle. In a 2012 study, people read very likely, meant as at least ninety percent, as sixty-two percent. They read very unlikely as forty-one percent.'
    sources: [S53, S51]
    transition: push-left
    beats: [0.0, "as sixty-two"]
    scene:
      name: pull_to_middle
      params:
        heading: What readers took the IPCC words to mean
        mean_label: readers' average
        range_label: meant as
        rows:
          - {word: very likely, lo: 90, hi: 100, mean: 62}
          - {word: likely, lo: 66, hi: 100, mean: 54}
          - {word: unlikely, lo: 0, hi: 33, mean: 44}
          - {word: very unlikely, lo: 0, hi: 10, mean: 41}
    hold: 0.5

  - id: s16
    say: 'A 2019 study tested a simple fix: put the number in brackets beside the word. Readers matched the official range about twice as well when they saw both.'
    sources: [S55]
    transition: glide
    beats: ["in brackets", "about twice", "saw both"]
    sfx:
      - cue: soft_click
        at: in brackets
        gain_db: -6
    scene:
      name: bracket_sentence
      params:
        before: X is
        word: very unlikely
        bracket: (05–20%)
        after: to happen.
        results:
          - {label: word alone, value: 32}
          - {label: number in brackets, value: 66}
    hold: 0.5

  - id: s17
    say: A word does not carry fixed odds by itself. Put the number beside it.
    sources: [S55]
    transition: dip
    beats: [0.0, "beside it"]
    scene:
      name: statement
      params:
        kicker: Check 1 · The word
        lines: ["A word has no fixed odds by itself.", "Put the number beside it."]
        highlight: ["Put the number beside it."]
    hold: 1.0

  # ================================================================ stop 2: the number's group
  - id: s18
    say: The number makes the word clearer. Next ask what that number counts.
    transition: dissolve
    scene:
      name: roadmap
      params:
        stops: *stops
        current: 1
        mode: travel
    hold: 0.3

  - id: s19
    say: Suppose tomorrow has a thirty-percent chance of rain. In a 2005 study, respondents often thought that meant rain for thirty percent of the day or across thirty percent of the area.
    sources: [S60]
    transition: dissolve
    beats: ["thirty percent of the day", "thirty percent of the area"]
    scene:
      name: rain_readings
      params:
        value: 30
        image: "image:raincloud"
        placeholders: true
        upto: 2
    hold: 0.4

  - id: s20
    say: The weather forecast means something else. Rain occurs on about three out of ten days with conditions like tomorrow's at that location.
    sources: [S65, S60]
    transition: cut
    beats: [0.0, 0.0, "something else", "three out of ten days"]
    sfx:
      - cue: chime
        at: three out of ten days
        gain_db: -10
    scene:
      name: rain_readings
      params:
        value: 30
        image: "image:raincloud"
        correct: 2
        placeholders: true
        keep: 2
    hold: 0.4

  - id: s21
    say: 'About two out of three New Yorkers chose that meaning. In four European cities, only one out of five to one out of three people did.'
    sources: [S60]
    transition: dissolve
    beats: [0.0, "In four European"]
    scene:
      name: bar_rows
      params:
        heading: Who understood the forecast group?
        rows:
          - {label: New York, value: 67, text: about 2 in 3, tone: known}
          - {label: "Amsterdam, Berlin, Milan, Athens", lo: 20, hi: 33, text: 1 in 5 to 1 in 3, tone: unknown}
    hold: 0.4

  - id: s22
    say: The missing piece is the reference class, meaning the group of cases being counted. Name that group. Otherwise, listeners will invent one.
    sources: [S60, S57]
    transition: dip
    beats: ["the group of cases", "Name that group", "listeners will"]
    scene:
      name: statement
      params:
        kicker: Check 2 · The number's group
        lines: ["30% of which cases?", "Name the group behind the number.", "Otherwise, listeners invent one."]
        highlight: ["Otherwise, listeners invent one."]
        note: "reference class: the group used for the count"
    hold: 1.0

  # ================================================================ stop 3: the picture
  - id: s23
    say: Clear words and numbers still need a clear picture. A picture can hide uncertainty even while trying to show it.
    transition: dissolve
    scene:
      name: roadmap
      params:
        stops: *stops
        current: 2
        mode: travel
    hold: 0.3

  - id: s24
    say: Consider a hurricane forecast. The National Hurricane Center draws a cone around the predicted track to show a likely area for the storm's center.
    sources: [S64]
    transition: dissolve
    beats: [0.0, "draws a cone"]
    sfx:
      - cue: whoosh
        at: draws a cone
        gain_db: -8
    scene:
      name: charley
      params:
        layers: [line, cone]
        note: Schematic, not to scale
    hold: 0.4

  - id: s25
    say: 'The cone is based on past forecast errors. About two thirds of storm centers stay inside it, which means about one third travel outside it.'
    sources: [S64, S63]
    transition: cut
    beats: [0.0, 0.0, "based on past", "one third"]
    scene:
      name: charley
      params:
        layers: [line, cone, circles, misses]
        note: Schematic, not to scale
        keep: 2
    hold: 0.4

  - id: s26
    say: In August 2004, Hurricane Charley's forecast line ran near Tampa. The storm struck Punta Gorda instead, about seventy miles south.
    sources: [S63]
    transition: dissolve
    beats: [0.0, 0.0, "struck Punta Gorda"]
    direction: Say "Punta Gorda" as "POON-tah GOR-dah".
    scene:
      name: charley
      params:
        layers: [line, cone, actual]
        note: Schematic, not to scale
        image: "image:hurricane"
        keep: 2
    hold: 0.4

  - id: s27
    say: Punta Gorda and the surrounding county had remained inside the cone for four days. Much television coverage still drew attention to the center line.
    sources: [S63]
    transition: cut
    beats: [0.0, 0.0, 0.0, "surrounding county"]
    direction: Say "Punta Gorda" as "POON-tah GOR-dah".
    scene:
      name: charley
      params:
        layers: [line, cone, actual, county]
        note: Schematic, not to scale
        image: "image:hurricane"
        keep: 3
    hold: 0.4

  - id: s28
    say: 'National Hurricane Center director Max Mayfield later joked that his tombstone should say, "Don''t focus on the skinny black line."'
    sources: [S63]
    transition: dissolve
    scene:
      name: quote_card
      params:
        text: Don't focus on the skinny black line.
        who: Max Mayfield, National Hurricane Center
        when: on the words for his tombstone
    hold: 0.5

  - id: s29
    say: Viewers may treat a forecast line as a promised path. Every uncertainty picture must explain what it includes and what it leaves out.
    transition: dip
    beats: [0.0, "promised path", "includes and what it leaves out"]
    scene:
      name: statement
      params:
        kicker: Check 3 · The picture
        lines: ["A forecast line can look like a promise.", "Explain what the picture includes", "and what it leaves out."]
        highlight: ["and what it leaves out."]
    hold: 1.0

  # ================================================================ stop 4: the single result
  - id: s30
    say: 'Now suppose the word, number, group, and picture are clear. One more trap remains: judging the forecast by one result.'
    transition: dissolve
    scene:
      name: roadmap
      params:
        stops: *stops
        current: 3
        mode: travel
    hold: 0.3

  - id: s31
    say: 'In its final 2016 forecast, FiveThirtyEight gave Donald Trump a twenty-nine-percent chance of winning the presidential election.'
    sources: [S62]
    transition: dissolve
    beats: ["FiveThirtyEight gave"]
    direction: Say "FiveThirtyEight" as "five thirty-eight".
    scene:
      name: bar_rows
      params:
        heading: Trump's chance, final forecasts, 8 November 2016
        rows: &models
          - {label: FiveThirtyEight, value: 29, tone: unknown, beat: 0}
          - {label: other model, value: 15, beat: 1}
          - {label: other model, value: 8, beat: 1}
          - {label: other model, value: 2, beat: 2}
          - {label: other model, value: 0.6, text: under 1%, beat: 2}
        upto: 1
    hold: 0.4

  - id: s32
    say: Other models gave him fifteen percent. Some placed his chance below one percent.
    sources: [S62]
    transition: cut
    beats: [0.0, "fifteen percent", "below one"]
    scene:
      name: bar_rows
      params:
        heading: Trump's chance, final forecasts, 8 November 2016
        rows: *models
        keep: 1
    hold: 0.4

  - id: s33
    say: 'Trump won. That result did not prove the twenty-nine-percent forecast wrong. Events with a twenty-nine-percent chance should occur about twenty-nine times out of one hundred.'
    sources: [S62]
    transition: dissolve
    beats: [0.0, "twenty-nine times"]
    sfx:
      - cue: tick
        at: twenty-nine times
        gain_db: -6
    scene:
      name: unit_grid
      params:
        heading: 29 in 100
        n: 100
        k: 29
        columns: 10
        label: 29 of 100
        caption: 29 marked squares show 29 chances in 100; the outline marks this result
        pick: true
    hold: 0.5

  - id: s34
    say: One result cannot test a probability. Explain that before anyone knows the result.
    transition: dip
    beats: [0.0, "Explain that before"]
    scene:
      name: statement
      params:
        kicker: Check 4 · One result
        lines: ["One result cannot test a probability.", "Explain that before the result is known."]
        highlight: ["Explain that before the result is known."]
    hold: 1.0

  # ================================================================ stop 5: words on purpose
  - id: s35
    say: 'If words can confuse people, should every field replace them with numbers? No. Some words set rules for action.'
    transition: dissolve
    scene:
      name: roadmap
      params:
        stops: *stops
        current: 4
        mode: travel
    hold: 0.3

  - id: s36
    say: 'Accounting provides one example. A rule called Accounting Standards Codification 450 sorts possible losses into three groups: probable, reasonably possible, and remote.'
    sources: [S71, S70]
    transition: push-up
    beats: ["Accounting Standards Codification 450"]
    direction: Say "ASC 450" as "A S C four fifty".
    sfx:
      - cue: paper
        at: Accounting Standards Codification 450
        gain_db: -10
    scene:
      name: action_ladder
      params:
        scale: ASC 450 (FAS 5), losses
        image: "image:ledger"
        rungs: &asc
          - {word: Probable, gloss: "“likely to occur”", action: record the loss}
          - {word: Reasonably possible, gloss: "“more than remote but less than likely”", action: explain in a note}
          - {word: Remote, gloss: "“slight”", action: usually no entry or note}
        upto: 1
    hold: 0.4

  - id: s37
    say: The rule defines these terms with words, not fixed percentages. Probable means likely to occur. Remote means the chance is slight.
    sources: [S71]
    transition: cut
    beats: [0.0, "Probable means"]
    scene:
      name: action_ladder
      params:
        scale: ASC 450 (FAS 5), losses
        image: "image:ledger"
        rungs: *asc
        keep: 1
        upto: 2
    hold: 0.4

  - id: s38
    say: 'Each term leads to an accounting action. A probable loss that can be estimated enters the accounts. A reasonably possible loss gets a note. A remote loss usually gets neither.'
    sources: [S71, S70]
    transition: cut
    beats: [0.0, 0.0, "A probable loss"]
    scene:
      name: action_ladder
      params:
        scale: ASC 450 (FAS 5), losses
        image: "image:ledger"
        rungs: *asc
        keep: 2
    hold: 0.4

  - id: s39
    say: 'Courts also use word-based levels. In the 1979 case Addington against Texas, the Supreme Court discussed three standards of proof. A standard tells a judge or jury how sure they must be.'
    sources: [S75]
    transition: push-left
    beats: [0.0]
    scene:
      name: risk_seesaw
      params:
        heading: Addington v. Texas, 1979
        image: "image:gavel"
        left: the side that brings the case
        right: the other side
        levels: &levels
          - {name: Preponderance of the evidence, share: 0.5, note: share the risk of error roughly equally}
          - {name: Beyond a reasonable doubt, share: 0.93, note: almost all the risk of error on society}
          - {name: Clear and convincing evidence, share: 0.72, note: in between}
        upto: 1
    hold: 0.4

  - id: s40
    say: 'In most civil disputes, the two sides bear the risk of error more evenly. In criminal cases, the government bears much more of that risk. Clear and convincing evidence lies between those levels.'
    sources: [S75]
    transition: cut
    beats: [0.0, "In criminal cases", "Clear and convincing"]
    scene:
      name: risk_seesaw
      params:
        heading: Addington v. Texas, 1979
        image: "image:gavel"
        left: the side that brings the case
        right: the other side
        levels: *levels
        keep: 1
    hold: 0.4

  - id: s41
    say: 'The Court did not attach percentages to these standards. It said their exact effect on decisions "may well be unknowable."'
    sources: [S75]
    transition: dissolve
    scene:
      name: quote_card
      params:
        text: the ultimate truth as to how the standards of proof affect decisionmaking may well be unknowable
        who: Addington v. Texas, US Supreme Court
        when: "1979"
    hold: 0.5

  - id: s42
    say: Some word scales exist to guide action, not to report exact odds. Before adding a number, ask what the scale is meant to do.
    sources: [S71, S75]
    transition: dip
    beats: [0.0, "guide action", "ask what"]
    scene:
      name: statement
      params:
        kicker: Check 5 · Words tied to action
        lines: ["Some word scales guide action.", "They do not report exact odds.", "Ask what the scale is meant to do."]
        highlight: ["Ask what the scale is meant to do."]
    hold: 1.0

  # ================================================================ stop 6: the whole statement
  - id: s43
    say: 'We have checked the word, number, group, picture, result, and kind of scale. One final part is still missing.'
    transition: dissolve
    scene:
      name: roadmap
      params:
        stops: *stops
        current: 5
        mode: travel
    hold: 0.3

  - id: s44
    say: 'In 2019, van der Bles and other researchers described the parts of a useful uncertainty statement. State what is uncertain. Then show its form, such as a probability, range, or word.'
    sources: [S56]
    transition: push-up
    beats: ["In 2019", "show its form"]
    direction: Say "van der Bles" as "fahn der BLESS".
    scene:
      name: checklist
      params:
        heading: Parts of a clear uncertainty statement
        items:
          - {title: What is uncertain, detail: "a fact, measurement, or claim"}
          - {title: How it is expressed, detail: "a probability, range, or word"}
          - {title: Strength of the evidence, detail: "how well the evidence supports it"}
        upto: 2
    hold: 0.4

  - id: s45
    say: 'The statement should also describe the strength of the evidence. The climate panel calls this confidence. It depends on how much evidence exists and how well the findings agree.'
    sources: [S56, S51]
    transition: cut
    beats: [0.0]
    scene:
      name: checklist
      params:
        heading: Parts of a clear uncertainty statement
        done: 2
        items:
          - {title: What is uncertain, detail: "a fact, measurement, or claim"}
          - {title: How it is expressed, detail: "a probability, range, or word"}
          - {title: Strength of the evidence, detail: "how well the evidence supports it"}
    hold: 0.4

  - id: s46
    say: Confidence and probability answer different questions. Probability gives the odds of an event. Confidence tells us how strongly the evidence supports those odds.
    sources: [S51]
    transition: dissolve
    beats: [0.0, "different questions", "Probability gives"]
    scene:
      name: confidence_grid
      params:
        heading: Probability and confidence answer different questions
        mark: [1, 1]
        likelihood: likely (55–80%)
    hold: 0.4

  - id: s47
    say: Here is a complete example. Rain tomorrow is likely, with a chance between fifty-five and eighty percent. That range refers to days with similar conditions at this location. Confidence in the range is medium.
    transition: dissolve
    beats: ["Rain tomorrow", "fifty-five and eighty", "similar conditions", "Confidence in"]
    scene:
      name: sentence_builder
      params:
        label: An example
        parts:
          - {text: Rain tomorrow is likely, tag: the word}
          - {text: "(55–80%),", tag: the number, mono: true}
          - {text: for days with similar conditions at this location., tag: the group}
          - {text: "Strength of evidence: medium.", tag: the evidence, newline: true}
    hold: 0.5

  - id: s48
    say: Give the word, the number, the group being counted, and the strength of the evidence.
    transition: dip
    beats: [0.0, "the number", "the group", "strength of the evidence"]
    scene:
      name: statement
      params:
        kicker: Check 6 · The full statement
        lines: ["Give the word,", "the number and its group,", "and the strength of the evidence."]
        highlight: ["and the strength of the evidence."]
    hold: 1.0

  # ================================================================ zoom out
  - id: s49
    say: 'The full message now comes together. Put the number beside the word. Name the group behind the number. Explain what the picture includes and leaves out.'
    transition: dissolve
    scene: &summary
      name: roadmap
      params:
        kicker: The complete message
        heading: Six checks for clear odds
        stops: *stops
        current: 6
        mode: summary
