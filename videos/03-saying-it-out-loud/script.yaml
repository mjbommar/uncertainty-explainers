        image: "image:folder"
        note: ["Missing from the report:", "the number and comparison group", "the strength of the evidence"]
        note_tone: warn
    hold: 0.5

  - id: s52
    say: A clearer sentence might have said this. The plan has about three chances in ten of success, compared with similar operations. Our confidence in that estimate is low.
    transition: dissolve
    beats: [0.0, "about three chances in ten"]
    sfx:
