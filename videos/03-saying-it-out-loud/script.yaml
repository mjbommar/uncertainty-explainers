# Video 3 of the Uncertainty Explainers: "Saying it out loud".
# Shape: docs/STRUCTURE.md, video 3. Opening question (Bay of Pigs), claim and map,
# six stops (bridge over `roadmap` in travel mode, vignette, takeaway on `statement`),
# zoom-out over `roadmap` in summary mode, the memo rewritten in full form.
# Thesis: uncertainty is not communicated until the listener holds the number the
# speaker meant. Notes: research/notes/06-communicating-uncertainty.md and
# 07-accounting-and-law.md.
# The ASC 450 wording is quoted by hand from FAS 5 as the PCAOB reprints it [S71]
# (the same definitions stand in ASC 450's glossary, docs/LOCAL-RESOURCES.md §6).
# The NWS "PoP = C x A" formula has no source here and is kept off screen.
# The full-form memo line in the zoom-out is our rewrite, not a historical text; it is
# labelled so on screen. ICD 203 forbids a likelihood and a confidence level in one
# sentence [S50]; that rule is not said, because the rewrite (as specified) joins them.
slug: 03-saying-it-out-loud
title: Saying it out loud
subtitle: Words, numbers, and the listener
target_seconds: 570
theme: ink
burn_captions: true
voice:
  model: gemini-3.1-flash-tts-preview
  voice: Enceladus
music:
  prompt: >-
    Calm, sparse documentary underscore. Warm felt piano with soft sustained pads,
    slow and reflective, no drums, no melody that competes with a voice.
  gain_db: -14
images:
  - id: folder
    prompt: a closed paper document folder with a single paper clip on its edge
    provider: openai
    quality: medium
  - id: hurricane
    prompt: a hurricane symbol, a round storm eye with two curved spiral arms
    provider: openai
    quality: medium
  - id: raincloud
    prompt: a small rain cloud with three falling rain drops
    provider: openai
    quality: medium
  - id: ledger
    prompt: an open accounting ledger book with ruled columns
    provider: openai
    quality: medium
  - id: gavel
    prompt: a judge's wooden gavel resting beside its round sound block
    provider: openai
    quality: medium
end_card:
  seconds: 5.0
  line: Say the word. Then say the number.
  note: "Uncertainty Explainers · 1 Two kinds of not knowing · 2 From evidence to forecast · 3 Saying it out loud"

segments:
  # ================================================================ opening: a fair chance, 1961
  - id: s01
    say: In February 1961, the Joint Chiefs of Staff reviewed a CIA plan to invade Cuba at the Bay of Pigs.
    sources: [S67, S68]
    scene:
      name: title_card
      params:
        label: Uncertainty Explainers · 3
        title: Saying it out loud
        subtitle: Words, numbers, and the listener
    hold: 0.5

  - id: s02
    say: 'Their report listed the plan''s weak points, then closed with a judgment. The plan, it said, "has a fair chance of ultimate success."'
    sources: [S68]
    transition: dissolve
    beats: [0.0, "fair chance"]
    sfx:
      - cue: paper
        at: 0.0
        gain_db: -8
    scene:
      name: memo
      params:
        stamp: JCSM-57-61 · Joint Chiefs to McNamara · 3 February 1961
        text: &memo_text Despite the shortcomings pointed out in the assessment, the Joint Chiefs of Staff consider that timely execution of this plan has a fair chance of ultimate success.
        highlight: a fair chance
        image: "image:folder"
        note: ["What the writer meant:", "about 3 in 10,", "a warning"]
        upto: 2
    hold: 0.4

  - id: s03
    say: 'The officer who drafted that line later said the Chiefs put the odds at roughly three in ten. He meant "fair" as a warning.'
    sources: [S67]
    transition: cut
    beats: [0.0, 0.0, "roughly three in ten"]
    scene:
      name: memo
      params:
        stamp: JCSM-57-61 · Joint Chiefs to McNamara · 3 February 1961
        text: *memo_text
        highlight: a fair chance
        image: "image:folder"
        note: ["What the writer meant:", "about 3 in 10,", "a warning"]
        keep: 2
    hold: 0.4

  - id: s04
    say: 'Other readers heard approval. The CIA quoted the phrase in a paper that argued for the invasion.'
    sources: [S67, S69]
    transition: glide
    beats: [0.0, "heard approval"]
    scene:
      name: two_column_compare
      params:
        heading: One phrase, two readings
        left:
          title: The writer
          tone: warn
          lines: ["About 3 chances in 10", "“Fair” meant as a warning"]
        right:
          title: The readers
          tone: unknown
          lines: ["Quoted by the CIA to argue for the plan"]
    hold: 0.4

  - id: s05
    say: President Kennedy came to believe that the Joint Chiefs had endorsed the plan. After the invasion collapsed, he wondered why no one had warned him.
    sources: [S67]
    transition: dissolve
    beats: [0.0, "wondered why"]
    scene:
      name: probability_bar
      params:
        heading: What the President heard
        label: "“a fair chance,” as its writer meant it"
        value: 30
        tone: warn
        note: heard as an endorsement
    hold: 0.5

  - id: s06
    say: Three in ten meant seven chances in ten of failure. Where, between the writer and the reader, did seven in ten disappear, and how do you stop it?
    transition: dip
    beats: [0.0, "seven chances in ten", "between the writer"]
    scene:
      name: statement
      params:
        lines: ["Written: about 3 in 10.", "Heard: an endorsement.", "Where did the other 7 in 10 go?"]
        highlight: ["Where did the other 7 in 10 go?"]
    hold: 0.8

  # ================================================================ claim and map
  - id: s07
    say: Uncertainty is not communicated until the listener holds the number the speaker meant. A message about uncertainty has parts, and each part can fail.
    transition: dissolve
    beats: [0.0, "until the listener", "the number the speaker"]
    scene:
      name: statement
      params:
        lines: ["Uncertainty is not communicated", "until the listener holds", "the number the speaker meant."]
        highlight: ["the number the speaker meant."]
    hold: 0.5

  - id: s08
    say: 'The message has six stops: the word, the group a number counts over, the picture, and the single result. Then words used on purpose, and the whole statement, with its missing part: how good the evidence is.'
    transition: dissolve
    scene:
      name: roadmap
      params:
        kicker: Six stops
        heading: Where the number can go missing
        stops: &stops
          - label: The word
            question: Does the word carry a number?
            takeaway: Put the number beside the word.
          - label: "The number's group"
            question: What does the number count over?
            takeaway: Name the group, or the listener picks one.
          - label: The picture
            question: What does the picture leave out?
            takeaway: Say what the picture leaves out.
          - label: The single result
            question: Can one outcome judge a forecast?
            takeaway: One outcome cannot judge a probability.
          - label: Words on purpose
            question: Why do some refuse numbers?
            takeaway: Know which ladder you are on.
          - label: The whole statement
            question: What does a full statement say?
            takeaway: Word, number, group, and how good the evidence is.
        current: -1
        mode: overview
    hold: 0.6

  # ================================================================ stop 1: the word
  - id: s09
    say: 'First, the word. The trouble began ten years before the Bay of Pigs.'
    sources: [S47]
    transition: dissolve
    scene:
      name: roadmap
      params:
        stops: *stops
        current: 0
        mode: travel
    hold: 0.3

  - id: s10
    say: 'In March 1951, a formal intelligence forecast said a Soviet attack on Yugoslavia "should be considered a serious possibility."'
    sources: [S47]
    transition: dissolve
    scene:
      name: quote_card
      params:
        text: an attack on Yugoslavia in 1951 should be considered a serious possibility.
        who: National Intelligence Estimate 29-51
        when: March 1951
    hold: 0.4

  - id: s11
    say: 'Sherman Kent, on the board that approved it, meant about sixty-five in a hundred. A State Department planner had read it as much lower.'
    sources: [S47]
    transition: glide
    beats: ["sixty-five", "State Department planner"]
    sfx:
      - cue: tick
        at: sixty-five
        gain_db: -4
    scene:
      name: phrase_readings
      params:
        phrase: serious possibility
        pins:
          - {value: 65, label: Kent, tone: unknown, up: true, beat: 0}
        zone: {hi: 60, lo: 8, label: "the planner's reading: much lower", beat: 1}
    hold: 0.4

  - id: s12
    say: 'The other board members had meant anything from twenty in a hundred to eighty. They had agreed on a phrase without agreeing on a number.'
    sources: [S47]
    transition: dissolve
    beats: [0.0, "anything from", "twenty in a hundred", "to eighty"]
    scene:
      name: phrase_readings
      params:
        phrase: serious possibility
        pins:
          - {value: 65, label: Kent, tone: unknown, up: true, beat: 0}
          - {value: 20, label: lowest, tone: known, beat: 2}
          - {value: 80, label: highest, tone: known, beat: 3}
        band: {lo: 20, hi: 80, label: the rest ranged in between, beat: 1}
        ghosts: 6
        keep: 1
    hold: 0.5

  - id: s13
    say: 'Kent''s fix was to give each word a number, and such ladders are now official. For United States intelligence, likely means fifty-five to eighty percent. For the Intergovernmental Panel on Climate Change, the IPCC, it means sixty-six to one hundred.'
    sources: [S50, S51]
    transition: dissolve
    beats: [0.0, "For the Intergovernmental", "sixty-six to one hundred"]
    scene: &ladders
      name: two_ladders
      params:
        top: &icd
          scale: ICD 203, intelligence
          rungs:
            - {word: almost no chance, lo: 1, hi: 5}
            - {word: very unlikely, lo: 5, hi: 20}
            - {word: unlikely, lo: 20, hi: 45}
            - {word: roughly even chance, lo: 45, hi: 55}
            - {word: likely, lo: 55, hi: 80}
            - {word: very likely, lo: 80, hi: 95}
            - {word: almost certain, lo: 95, hi: 99}
        bottom: &ipcc
          scale: IPCC, climate
          rungs:
            - {word: exceptionally unlikely, lo: 0, hi: 1}
            - {word: very unlikely, lo: 0, hi: 10}
            - {word: unlikely, lo: 0, hi: 33}
            - {word: about as likely as not, lo: 33, hi: 66}
            - {word: likely, lo: 66, hi: 100}
            - {word: very likely, lo: 90, hi: 100}
            - {word: virtually certain, lo: 99, hi: 100}
        highlight: likely
    hold: 0.4

  - id: s14
    say: So a sixty percent chance is likely to an intelligence analyst, but only about as likely as not to a climate scientist.
    sources: [S50, S51]
    transition: cut
    beats: [0.0, 0.0, 0.0, "sixty percent"]
    scene:
      name: two_ladders
      params:
        top: *icd
        bottom: *ipcc
        highlight: likely
        probe: 60
        keep: 3
    hold: 0.5

  - id: s15
    say: 'Readers bend the words too. In a 2012 study, Americans put very likely, meant as ninety percent or more, at sixty-two. Very unlikely came out at forty-one.'
    sources: [S53, S51]
    transition: push-left
    beats: [0.0, "at sixty-two"]
    scene:
      name: pull_to_middle
      params:
        heading: What readers took the IPCC words to mean
        mean_label: readers' average
        range_label: meant as
        rows:
          - {word: very likely, lo: 90, hi: 100, mean: 62}
          - {word: likely, lo: 66, hi: 100, mean: 54}
          - {word: unlikely, lo: 0, hi: 33, mean: 44}
          - {word: very unlikely, lo: 0, hi: 10, mean: 41}
    hold: 0.5

  - id: s16
    say: A 2019 study found a fix that works, the number in brackets inside the sentence. With the word alone, readers' ranges overlapped the official range by about a third. With the bracket, by about two thirds.
    sources: [S55]
    transition: glide
    beats: ["in brackets", "about a third", "about two thirds"]
    sfx:
      - cue: soft_click
        at: in brackets
        gain_db: -6
    scene:
      name: bracket_sentence
      params:
        before: X is
        word: very unlikely
        bracket: (05–20%)
        after: to happen.
        results:
          - {label: word alone, value: 32}
          - {label: number in brackets, value: 66}
    hold: 0.5

  - id: s17
    say: A word carries a number only if the number is beside it.
    sources: [S55]
    transition: dip
    beats: [0.0, "only if"]
    scene:
      name: statement
      params:
        kicker: Stop 1 · The word
        lines: ["A word carries a number", "only if the number is beside it."]
        highlight: ["only if the number is beside it."]
    hold: 1.0

  # ================================================================ stop 2: the number's group
  - id: s18
    say: A number beside the word fixes the word. But a number can fail too.
    transition: dissolve
    scene:
      name: roadmap
      params:
        stops: *stops
        current: 1
        mode: travel
    hold: 0.3

  - id: s19
    say: Take a thirty percent chance of rain tomorrow. In 2005, researchers asked people in five cities what that means. Many said rain thirty percent of the time, or over thirty percent of the area.
    sources: [S60]
    transition: dissolve
    beats: ["thirty percent of the time", "thirty percent of the area"]
    scene:
      name: rain_readings
      params:
        value: 30
        image: "image:raincloud"
        placeholders: true
        upto: 2
    hold: 0.4

  - id: s20
    say: The weather service means something else. It rains on about three of every ten days like tomorrow.
    sources: [S65, S60]
    transition: cut
    beats: [0.0, 0.0, "something else", "three of every ten days"]
    sfx:
      - cue: chime
        at: three of every ten days
        gain_db: -10
    scene:
      name: rain_readings
      params:
        value: 30
        image: "image:raincloud"
        correct: 2
        placeholders: true
        keep: 2
    hold: 0.4

  - id: s21
    say: 'In New York, about two thirds chose that meaning. In four European cities, only one third to one fifth did.'
    sources: [S60]
    transition: dissolve
    beats: [0.0, "In four European"]
    scene:
      name: bar_rows
      params:
        heading: Who chose "3 of 10 days like this"
        rows:
          - {label: New York, value: 67, text: about 2 in 3, tone: known}
          - {label: "Amsterdam, Berlin, Milan, Athens", lo: 20, hi: 33, text: 1 in 5 to 1 in 3, tone: unknown}
    hold: 0.4

  - id: s22
    say: The missing piece is the reference class, the set of cases a number counts over. A number needs its reference class, or the listener supplies their own.
    sources: [S60, S57]
    transition: dip
    beats: ["the set of cases", "A number needs", "or the listener"]
    scene:
      name: statement
      params:
        kicker: Stop 2 · The number's group
        lines: ["30% of what?", "A number needs its reference class,", "or the listener supplies their own."]
        highlight: ["or the listener supplies their own."]
        note: "reference class: the set of cases a number counts over"
    hold: 1.0

  # ================================================================ stop 3: the picture
  - id: s23
    say: Words and numbers fail in the ear. Pictures fail in the eye.
    transition: dissolve
    scene:
      name: roadmap
      params:
        stops: *stops
        current: 2
        mode: travel
    hold: 0.3

  - id: s24
    say: The clearest case is a hurricane. The National Hurricane Center draws a cone around a storm's forecast track, to show where its center will probably go.
    sources: [S64]
    transition: dissolve
    beats: [0.0, "draws a cone"]
    sfx:
      - cue: whoosh
        at: draws a cone
        gain_db: -8
    scene:
      name: charley
      params:
        layers: [line, cone]
        note: Schematic, not to scale
    hold: 0.4

  - id: s25
    say: 'Each circle is sized so that two thirds of past forecast errors fall inside. So about one time in three, the center leaves the cone.'
    sources: [S64, S63]
    transition: cut
    beats: [0.0, 0.0, "Each circle", "one time in three"]
    scene:
      name: charley
      params:
        layers: [line, cone, circles, misses]
        note: Schematic, not to scale
        keep: 2
    hold: 0.4

  - id: s26
    say: In August 2004, the forecast line for Hurricane Charley ran close to Tampa. Charley struck Punta Gorda instead, about seventy miles to the south.
    sources: [S63]
    transition: dissolve
    beats: [0.0, 0.0, "struck Punta Gorda"]
    direction: Say "Punta Gorda" as "POON-tah GOR-dah".
    scene:
      name: charley
      params:
        layers: [line, cone, actual]
        note: Schematic, not to scale
        image: "image:hurricane"
        keep: 2
    hold: 0.4

  - id: s27
    say: Charlotte County, around Punta Gorda, had been inside the cone for four days. But much of the television coverage had pointed viewers at the line.
    sources: [S63]
    transition: cut
    beats: [0.0, 0.0, 0.0, "Charlotte County"]
    direction: Say "Punta Gorda" as "POON-tah GOR-dah".
    scene:
      name: charley
      params:
        layers: [line, cone, actual, county]
        note: Schematic, not to scale
        image: "image:hurricane"
        keep: 3
    hold: 0.4

  - id: s28
    say: 'The hurricane center''s director, Max Mayfield, later joked about his tombstone: "Don''t focus on the skinny black line."'
    sources: [S63]
    transition: dissolve
    scene:
      name: quote_card
      params:
        text: Don't focus on the skinny black line.
        who: Max Mayfield, National Hurricane Center
        when: on the words for his tombstone
    hold: 0.5

  - id: s29
    say: A picture of uncertainty is read as a picture of certainty, unless it says what it leaves out.
    transition: dip
    beats: [0.0, "read as a picture", "unless it says"]
    scene:
      name: statement
      params:
        kicker: Stop 3 · The picture
        lines: ["A picture of uncertainty", "is read as a picture of certainty,", "unless it says what it leaves out."]
        highlight: ["unless it says what it leaves out."]
    hold: 1.0

  # ================================================================ stop 4: the single result
  - id: s30
    say: Suppose the word, the number, the group and the picture are all right.
    transition: dissolve
    scene:
      name: roadmap
      params:
        stops: *stops
        current: 3
        mode: travel
    hold: 0.3

  - id: s31
    say: 'The listener still judges by one outcome. In its final 2016 forecast, FiveThirtyEight gave Donald Trump about a twenty-nine percent chance of winning.'
    sources: [S62]
    transition: dissolve
    beats: ["FiveThirtyEight gave"]
    direction: Say "FiveThirtyEight" as "five thirty-eight".
    scene:
      name: bar_rows
      params:
        heading: Trump's chance, final forecasts, 8 November 2016
        rows: &models
          - {label: FiveThirtyEight, value: 29, tone: unknown, beat: 0}
          - {label: other model, value: 15, beat: 1}
          - {label: other model, value: 8, beat: 1}
          - {label: other model, value: 2, beat: 2}
          - {label: other model, value: 0.6, text: under 1%, beat: 2}
        upto: 1
    hold: 0.4

  - id: s32
    say: Other models gave him fifteen percent, and some gave him less than one.
    sources: [S62]
    transition: cut
    beats: [0.0, "fifteen percent", "less than one"]
    scene:
      name: bar_rows
      params:
        heading: Trump's chance, final forecasts, 8 November 2016
        rows: *models
        keep: 1
    hold: 0.4

  - id: s33
    say: 'Trump won. But twenty-nine in a hundred is more than one chance in four, and events with those odds happen all the time.'
    sources: [S62]
    transition: dissolve
    beats: [0.0, "more than one chance"]
    sfx:
      - cue: tick
        at: happen all the time
        gain_db: -6
    scene:
      name: unit_grid
      params:
        heading: 29 in 100
        n: 100
        k: 29
        columns: 10
        label: 29 of 100
        caption: each square one draw of a 29% chance; the outline is this draw
        pick: true
    hold: 0.5

  - id: s34
    say: One outcome cannot judge a probability. Say so before the outcome arrives.
    transition: dip
    beats: [0.0, "Say so before"]
    scene:
      name: statement
      params:
        kicker: Stop 4 · The single result
        lines: ["One outcome cannot judge a probability.", "Say so before the outcome arrives."]
        highlight: ["Say so before the outcome arrives."]
    hold: 1.0

  # ================================================================ stop 5: words on purpose
  - id: s35
    say: 'If words fail so often, why not always use numbers?'
    transition: dissolve
    scene:
      name: roadmap
      params:
        stops: *stops
        current: 4
        mode: travel
    hold: 0.3

  - id: s36
    say: 'Some institutions refuse them on purpose. Take accounting. Under its rule for losses, now called ASC 450, a loss is probable, reasonably possible, or remote.'
    sources: [S71, S70]
    transition: push-up
    beats: ["Under its rule"]
    direction: Say "ASC 450" as "A S C four fifty".
    sfx:
      - cue: paper
        at: ASC 450
        gain_db: -10
    scene:
      name: action_ladder
      params:
        scale: ASC 450 (FAS 5), losses
        image: "image:ledger"
        rungs: &asc
          - {word: Probable, gloss: "“likely to occur”", action: book it}
          - {word: Reasonably possible, gloss: "“more than remote but less than likely”", action: tell readers}
          - {word: Remote, gloss: "“slight”", action: nothing}
        upto: 1
    hold: 0.4

  - id: s37
    say: The rule defines each word only with other words. Probable means likely to occur, and remote means slight.
    sources: [S71]
    transition: cut
    beats: [0.0, "Probable means"]
    scene:
      name: action_ladder
      params:
        scale: ASC 450 (FAS 5), losses
        image: "image:ledger"
        rungs: *asc
        keep: 1
        upto: 2
    hold: 0.4

  - id: s38
    say: 'Each word sets an action. A probable loss that can be estimated goes into the accounts. A reasonably possible one gets a note, and a remote one gets neither.'
    sources: [S71, S70]
    transition: cut
    beats: [0.0, 0.0, "A probable loss"]
    scene:
      name: action_ladder
      params:
        scale: ASC 450 (FAS 5), losses
        image: "image:ledger"
        rungs: *asc
        keep: 2
    hold: 0.4

  - id: s39
    say: 'Courts have a ladder too. In Addington against Texas, in 1979, the Supreme Court described three standards of proof: how sure the judge or jury must be.'
    sources: [S75]
    transition: push-left
    beats: [0.0]
    scene:
      name: risk_seesaw
      params:
        heading: Addington v. Texas, 1979
        image: "image:gavel"
        left: the side that brings the case
        right: the other side
        levels: &levels
          - {name: Preponderance of the evidence, share: 0.5, note: share the risk of error roughly equally}
          - {name: Beyond a reasonable doubt, share: 0.93, note: almost all the risk of error on society}
          - {name: Clear and convincing evidence, share: 0.72, note: in between}
        upto: 1
    hold: 0.4

  - id: s40
    say: 'In a money dispute, the two sides share the risk of error about equally. In a criminal case, society takes almost all of it. Clear and convincing evidence sits between.'
    sources: [S75]
    transition: cut
    beats: [0.0, "In a criminal case", "Clear and convincing"]
    scene:
      name: risk_seesaw
      params:
        heading: Addington v. Texas, 1979
        image: "image:gavel"
        left: the side that brings the case
        right: the other side
        levels: *levels
        keep: 1
    hold: 0.4

  - id: s41
    say: 'The Court put no numbers on these phrases. It said that how they shape decisions "may well be unknowable."'
    sources: [S75]
    transition: dissolve
    scene:
      name: quote_card
      params:
        text: the ultimate truth as to how the standards of proof affect decisionmaking may well be unknowable
        who: Addington v. Texas, US Supreme Court
        when: "1979"
    hold: 0.5

  - id: s42
    say: Some ladders are words on purpose, tied to actions. Know which ladder you are on.
    sources: [S71, S75]
    transition: dip
    beats: [0.0, "tied to actions", "Know which"]
    scene:
      name: statement
      params:
        kicker: Stop 5 · Words on purpose
        lines: ["Some ladders are words on purpose,", "tied to actions.", "Know which ladder you are on."]
        highlight: ["Know which ladder you are on."]
    hold: 1.0

  # ================================================================ stop 6: the whole statement
  - id: s43
    say: 'Word, number, group, picture, one result, and the ladder you are on.'
    transition: dissolve
    scene:
      name: roadmap
      params:
        stops: *stops
        current: 5
        mode: travel
    hold: 0.3

  - id: s44
    say: 'One piece is still missing. In 2019, van der Bles and colleagues set out what a statement of uncertainty should contain. It says what you are unsure about, and in what form, such as a range or a word.'
    sources: [S56]
    transition: push-up
    beats: ["In 2019", "in what form"]
    direction: Say "van der Bles" as "fahn der BLESS".
    scene:
      name: checklist
      params:
        heading: What to say, after van der Bles and colleagues, 2019
        items:
          - {title: What you are unsure about, detail: "a fact, a number, or a scientific claim"}
