status: ready for upload
title: Say what the odds mean | Uncertainty Explainers 3
description: |
  In February 1961, the Joint Chiefs of Staff said the Bay of Pigs plan had "a fair chance" of
  success. The officer who wrote that phrase meant about three chances in ten. Other readers heard
  support for the plan. Where did the seven chances in ten of failure disappear?

  Communication succeeds only when the listener understands the odds the speaker meant. This video
  follows six points where meaning can change: the word (Sherman Kent's "serious possibility" and
  the intelligence and climate scales), the number's group (a 30 percent chance of rain), the
  picture (the hurricane cone and Hurricane Charley), one result (the 2016 election forecasts),
  words tied to action (accounting's probable and remote, and the courts' standards of proof), and
  the full statement: the word, the number, the group, and the strength of the evidence.

  Third of three. 1: Not knowing comes in different forms. 2: How evidence becomes a forecast.
