status: ready for upload
title: How evidence becomes a forecast | Uncertainty Explainers 2
description: |
  A forty-year-old woman gets a routine breast cancer screening, and the result is positive. In a
  1982 study, 95 of 100 doctors put her chance of cancer between 70 and 80 percent. The correct
  answer was about 8 percent. Where does a probability come from, and how can we test one?

  A probability sums up evidence. It is not a hidden fact waiting inside the world. Five stops show
  how to build one honestly: name the group being counted (the reference class, with Laplace's
  sunrise), update from the base rate with Bayes' rule (one thousand women, one test), use a range
  when evidence is thin (Ellsberg's urn), say what kind of claim about the future you are making
  (Hume, Lorenz, and a 50-run weather ensemble), and score many forecasts to check them (the Brier
  score and calibration).

  Second of three. Next: Say what the odds mean.
chapters:
