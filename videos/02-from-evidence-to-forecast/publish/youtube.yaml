  - {segment: b3, title: "3. When is one number too many?"}
  - {segment: b4, title: "4. What can it say about the future?"}
  - {segment: b5, title: "5. How do we test a forecast?"}
  - {segment: z1, title: Putting it together}
  - {segment: z4, title: "Next: Say what the odds mean"}
