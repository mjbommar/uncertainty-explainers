# Video 2 of Uncertainty Explainers. Shape from docs/STRUCTURE.md, video 2:
# opening question, claim, map, five stops (bridge in, vignette, takeaway), zoom out.
# Every factual segment cites keys in research/SOURCES.md. Numbers marked
# "(ours)" in storyboard.md are arithmetic on a source's own figures.
#
# The spine, written first.
#   Question: where does a probability come from, and how can you tell whether it is any good?
#   Claim: a probability is a summary of evidence, not a fact about the world.
#   1 The group    What is the number counting?       A probability counts over a group. Name the group, or the number floats.
#   2 The update   How should evidence move it?       Start from how common it is, then let the test move you. Rare things stay rare after one test.
#   3 The width    When is one number too many?       When evidence is thin, an honest summary is a range, not a point.
#   4 The future   What can it say about the future?  A forecast leans on the past and on a model. Say which kind of claim it is, and show the spread.
#   5 The score    How do we know it was good?        One outcome proves nothing. Many forecasts, scored, do.
slug: 02-from-evidence-to-forecast
title: How evidence becomes a forecast
subtitle: Build a probability, state its limits, and test it
target_seconds: 400
theme: ink
burn_captions: true
voice:
  model: gemini-3.1-flash-tts-preview
  voice: Enceladus
music:
  prompt: >-
    Calm, sparse documentary underscore. Warm felt piano with soft sustained pads,
    slow and reflective, no drums, no melody that competes with a voice.
  gain_db: -14
images:
  - id: patient
    prompt: a calm woman of about forty seated in a clinic waiting room chair, hands folded
  - id: test_result
    prompt: a single medical test result card on a clipboard, marked with a large plus sign
  - id: sunrise
    prompt: the sun half risen above a flat horizon line, with a few short rays
  - id: storm
    prompt: a heavy storm cloud with slanted rain lines
end_card:
  seconds: 3.5
  line: "Next: Say what the odds mean"
  note: Uncertainty Explainers, video 3
segments:
  # ================================================================ pose the problem
  - id: open1
    say: A forty-year-old woman gets a routine breast cancer screening. Her test result is positive.
    sources: [S59]
    transition: dissolve
    beats: ["forty-year-old woman", "positive"]
    scene:
      name: card_row
      params:
        kicker: Start with one patient
        heading: A positive result after routine screening
        cards:
          - {title: The patient, line: "Age 40, routine screening", image: "image:patient"}
          - {title: The test, line: "Positive result", tone: warn, image: "image:test_result"}

  - id: open2
    say: In a 1982 study, ninety-five out of one hundred doctors said her chance of cancer was between seventy and eighty percent.
    sources: [S59]
    transition: glide
    beats: ["seventy and eighty"]
    scene:
      name: interval_rows
      params: &doctors
        heading: Chance of cancer after a positive result
        axis_label: chance of cancer
        ticks: [{v: 0, label: "0%"}, {v: 0.25, label: "25%"}, {v: 0.5, label: "50%"}, {v: 0.75, label: "75%"}, {v: 1, label: "100%"}]
        rows:
          - {label: "Answer from 95 of 100 doctors", lo: 0.7, hi: 0.8, note: "70% to 80%", tone: warn}

  - id: open3
    say: The correct answer was about eight percent. Most doctors gave an answer almost ten times too high.
    sources: [S59]
    transition: cut
    beats: ["correct answer", "about eight"]
    sfx:
      - {cue: soft_click, at: "about eight", gain_db: -8}
    scene:
      name: interval_rows
      params: &doctors_both
        heading: Chance of cancer after a positive result
        axis_label: chance of cancer
        steady: true
        ticks: [{v: 0, label: "0%"}, {v: 0.25, label: "25%"}, {v: 0.5, label: "50%"}, {v: 0.75, label: "75%"}, {v: 1, label: "100%"}]
        rows:
          - {label: "Answer from 95 of 100 doctors", lo: 0.7, hi: 0.8, note: "70% to 80%", tone: warn, shown: true}
          - {label: "Answer from the full count", lo: 0.078, hi: 0.078, note: "7.8%"}
    hold: 0.3

  - id: open4
    say: How can the same test lead to such different numbers? Where does a probability come from, and how can we test it?
    transition: dissolve
    scene:
      name: title_card
      params:
        label: The problem
        title: Where does a probability come from?
        subtitle: How can we test whether it is sound?
    hold: 0.6

  # ================================================================ claim and map
  - id: claim
    say: A probability sums up evidence. It is not a hidden fact waiting inside the world. We must choose the evidence, judge its limits, and test the result.
    transition: dissolve
    beats: ["sums up evidence", "choose the evidence", "judge its limits", "test the result"]
    scene:
      name: card_row
      params:
        kicker: Main idea
        heading: A probability sums up evidence
        cards:
          - {title: Evidence, line: "The number begins with observations", tone: unknown}
          - {title: Limits, line: "Weak evidence supports a wider answer"}
          - {title: Future, line: "A model connects evidence to what may happen", tone: unknown}
          - {title: Test, line: "Many results show whether it works", tone: cool}
    hold: 0.6

  - id: map
    say: "We will make five stops: the group being counted, the update after new evidence, the width of the answer, the kind of future claim, and the score."
    transition: dissolve
    scene:
      name: roadmap
      params:
        kicker: Five questions
        mode: overview
        current: -1
        stops: &stops
          - {label: The group, question: "Who or what are we counting?", takeaway: "Name the group behind the number."}
          - {label: The update, question: "What does new evidence change?", takeaway: "Start with the base rate."}
          - {label: The range, question: "How exact can we be?", takeaway: "Thin evidence needs a range."}
          - {label: The future, question: "What kind of claim is this?", takeaway: "Name the model and assumptions."}
          - {label: The test, question: "Did the forecasts work?", takeaway: "Score many forecasts, not one."}
    hold: 0.4

  # ================================================================ stop 1: the group
  - id: b1
    say: First ask what the number counts. That question will show where the doctors went wrong.
    transition: dissolve
    scene:
      name: roadmap
      params: {kicker: "Stop 1 of 5", mode: travel, current: 0, stops: *stops}

  - id: g1
    say: 'A reference class is the group used for a count. Philosopher Alan Hájek belongs to several groups: men, non-smokers, and philosophy professors. Each group gives him different odds of living to eighty.'
    sources: [S15]
    transition: dissolve
    beats: ["reference class", "non-smoker", "philosophy professor"]
    direction: Say Hájek as HAH-yek.
    scene:
      name: card_row
      params:
        kicker: A reference class is a group used for a count
        heading: Which group should set the odds?
        cards:
          - {title: Men, line: "One group gives one set of odds"}
          - {title: Non-smokers, line: "A narrower group gives different odds", tone: unknown}
          - {title: Philosophy professors, line: "Another group changes them again", tone: cool}

  - id: g2
    say: In 1814, Pierre-Simon Laplace counted about five thousand years of recorded sunrises. His count gave odds near two million to one for another sunrise.
    sources: [S16]
    transition: dissolve
    beats: ["five thousand years", "near two million"]
    direction: Say Laplace as la-PLAHSS.
    scene:
      name: big_number
      params:
        value: 1826214
        suffix: " to 1"
        label: Odds from Laplace's sunrise count
        sub: 1,826,213 recorded days formed the group
        image: "image:sunrise"

  - id: g3
    say: Laplace added that an astronomer would give much higher odds. The astronomer knew why days and seasons occur. The event stayed the same, but the evidence changed.
    sources: [S16]
    transition: push-left
    beats: ["Laplace added", "much higher"]
    scene:
      name: two_column_compare
      params:
        heading: The event stays the same; the evidence changes
        left:
          title: Count alone
          lines: ["Uses past sunrises", "Odds: 1,826,214 to 1"]
          tone: known
        right:
          title: Count plus a model
          lines: ["Explains days and seasons", "Odds: much higher"]
          tone: unknown

  - id: t1
    say: Every probability uses a group. Name that group, or the number has no clear meaning.
    transition: dissolve
    scene:
      name: takeaway_line
      params: {text: "Every probability uses a group. Name the group behind the number.", stop: 0, of: 5, label: The group}
    hold: 0.6

  # ================================================================ stop 2: the update
  - id: b2
    say: The group gives the number a base. The doctors still missed because they used the test result badly.
    transition: dissolve
    scene:
      name: roadmap
      params: {kicker: "Stop 2 of 5", mode: travel, current: 1, stops: *stops}

  - id: u1
    say: Bayes' rule shows how new evidence should change a probability. It begins with the base rate, which is how common the disease was before the test.
    sources: [S21]
    transition: wipe
    beats: ["Bayes' rule", "base rate", "before the test"]
    direction: Bayes rhymes with days.
    scene:
      name: card_row
      params:
        kicker: Bayes' rule updates a probability
        heading: Begin before the new evidence
        cards:
          - {title: Base rate, line: "How common it was before the test", tone: unknown}
          - {title: Test result, line: "How the result differs with and without disease"}
          - {title: Updated odds, line: "What both pieces support together", tone: cool}

  - id: u2
    say: 'Picture one thousand forty-year-old women at routine screening. Ten have breast cancer. That count gives the base rate: one in one hundred.'
    sources: [S59]
    transition: dissolve
    beats: ["one thousand", "Ten have"]
    scene:
      name: icon_array
      params:
        heading: One thousand women, one test
        step: 0

  - id: u3
    say: Eight of the ten women with cancer test positive. Ninety-five of the nine hundred and ninety women without cancer also test positive.
    sources: [S59]
    transition: cut
    beats: ["Eight of the ten", "Ninety-five"]
    sfx:
      - {cue: tick, at: "Eight of the ten", gain_db: -6}
    scene:
      name: icon_array
      params:
        heading: One thousand women, one test
        step: 1
        steady: true

  - id: u4
    say: In all, one hundred and three women get a positive result. Only eight have cancer. Eight out of one hundred and three is about seven point eight percent.
    sources: [S59]
    transition: cut
    beats: ["one hundred and three", "only eight"]
    sfx:
      - {cue: chime, at: "seven point eight", gain_db: -8}
    scene:
      name: icon_array
      params:
        heading: One thousand women, one test
        step: 2
        steady: true
    hold: 0.4

  - id: u5
    say: Cancer is rare in this group, so most positive results come from women without cancer. The doctors focused on the test and lost sight of the base rate.
    sources: [S59]
    transition: dissolve
    beats: ["Cancer is rare", "lost sight"]
    scene:
      name: interval_rows
      params:
        heading: What happens when the base rate is missing
        axis_label: chance of cancer
        ticks: [{v: 0, label: "0%"}, {v: 0.25, label: "25%"}, {v: 0.5, label: "50%"}, {v: 0.75, label: "75%"}, {v: 1, label: "100%"}]
        rows:
          - {label: "Full count, including the base rate", lo: 0.078, hi: 0.078, note: "7.8%"}
          - {label: "Answer with the base rate missed", lo: 0.7, hi: 0.8, note: "70% to 80%", tone: warn}

  - id: u6
    say: Whole-number counts made the problem easier. In a 1995 study, correct answers rose from sixteen percent with percentages to about half with counts.
    sources: [S59]
    transition: glide
    beats: ["sixteen percent", "about half", "with counts"]
    direction: Say Gigerenzer as GIG-er-en-tser.
    scene:
      name: bars
      params:
        heading: Correct answers rose when people saw counts
        max: 100
        unit: "%"
        items:
          - {label: "Numbers given as percentages", value: 16, tone: warn}
          - {label: "Numbers given as counts, standard form", value: 46}
          - {label: "Numbers given as counts, short form", value: 50}

  - id: t2
    say: Start with how common the event is. Then use the new evidence to update it. One test rarely turns a rare event into a common one.
    transition: dissolve
    scene:
      name: takeaway_line
      params: {text: "Start with the base rate. Then update it with the new evidence.", stop: 1, of: 5, label: The update}
    hold: 0.6

  # ================================================================ stop 3: the width
  - id: b3
    say: Here, the group and test supported one useful number. We are not always that lucky.
    transition: dissolve
    scene:
      name: roadmap
      params: {kicker: "Stop 3 of 5", mode: travel, current: 2, stops: *stops}

  - id: w1
    say: A coin that lands heads fifty times in one hundred tosses supports odds near one half. An unseen coin might also be assigned one half, but no toss supports that point. A range from zero to one shows our ignorance.
    sources: [S23]
    transition: dissolve
    beats: ["A coin that", "unseen coin", "A range"]
    scene:
      name: interval_rows
      params:
        heading: Same point, different evidence
        then_beat: 2
        ticks: [{v: 0, label: "0"}, {v: 0.5, label: "1/2"}, {v: 1, label: "1"}]
        axis_label: chance of heads
        rows:
          - {label: "100 tosses, 50 heads", lo: 0.5, hi: 0.5, note: "point near 1/2"}
          - {label: "Unseen coin", lo: 0.5, hi: 0.5, note: "guess: 1/2", then: {lo: 0.0, hi: 1.0}, then_note: "0 to 1"}

  - id: w2
    say: Daniel Ellsberg gave another example in 1961. An urn holds thirty red balls. The other sixty are black or yellow, but no one tells us the mix.
    sources: [S77]
    transition: dissolve
    beats: ["in 1961", "other sixty"]
    sfx:
      - {cue: marbles, at: "thirty red", gain_db: -6}
    scene:
      name: ellsberg_urn
      params:
        heading: Ellsberg's urn, 1961
        red: 30
        other: 60
        notes: ["30 red: known", "60 black or yellow: mix unknown"]

  - id: w3
    say: The chance of drawing red is exactly one third. The chance of black could be anywhere from zero to two thirds. A dot fits one answer; a range fits the other.
    sources: [S23]
    transition: glide
    beats: ["chance of drawing red", "chance of black"]
    scene:
      name: interval_rows
      params:
        heading: "Known count: a point. Unknown mix: a range."
        ticks: [{v: 0, label: "0"}, {v: 0.3333, label: "1/3"}, {v: 0.6667, label: "2/3"}, {v: 1, label: "1"}]
        axis_label: chance of drawing
        rows:
          - {label: Red, lo: 0.3333, hi: 0.3333, note: "1/3", tone: warn}
          - {label: Black, lo: 0.0, hi: 0.6667, note: "0 to 2/3", tone: unknown}

  - id: t3
    say: Thin evidence calls for a range. One exact point would hide how little we know.
    transition: dissolve
    scene:
      name: takeaway_line
      params: {text: "Thin evidence needs a range. One exact point hides what we do not know.", stop: 2, of: 5, label: The range}
    hold: 0.6

  # ================================================================ stop 4: the future
  - id: b4
    say: 'A range shows the limits of today''s evidence. A forecast adds a harder step: a claim about the future.'
    transition: dissolve
    scene:
      name: roadmap
      params: {kicker: "Stop 4 of 5", mode: travel, current: 3, stops: *stops}

  - id: f1
    say: 'Forecasts use patterns from the past. In 1748, David Hume pointed out the hidden assumption: we expect the future to behave like the past.'
    sources: [S28]
    transition: dissolve
    beats: ["patterns from the past", "David Hume", "like the past"]
    scene:
      name: induction_gap
      params:
        heading: From past to future
        count: 14
        past_label: every recorded sunrise
        future_label: tomorrow
        gap_label: "assumption: the pattern continues"

  - id: f2
    say: A forecast also uses a model, which is a simplified account of how something works. In 1963, Edward Lorenz showed that tiny changes at the start could lead to very different results.
    sources: [S43]
    transition: dissolve
    scene:
      name: divergence
      params:
        kicker: Small changes can grow
        heading: Nearly equal starts, very different results
        paths: 2
        seed: 4
        growth: 5
        spread: 0.9
        start_label: almost the same starting values
        x_label: time

  - id: f3
    say: Europe's main weather center therefore runs its model fifty times with slightly different starting values. A tight group of runs supports a firmer forecast. A wide spread signals more uncertainty.
    sources: [S44]
    transition: dissolve
    beats: ["fifty times", "tight group", "wide spread"]
    sfx:
      - {cue: whoosh, at: "fifty times", gain_db: -8}
    scene:
      name: spaghetti_plot
      params:
        heading: 50 model runs show the possible spread
        paths: 51
        seed: 5
        spread: 0.8
        x_label: days ahead
        start_label: now
        image: "image:storm"

  - id: f4
    say: Different future claims do different jobs. Forecasts start with current conditions. Projections depend on stated assumptions. Scenarios describe possible paths without assigning odds.
    sources: [S46]
    transition: wipe
    beats: ["Forecasts start", "Projections", "Scenarios"]
    scene:
      name: sort_table
      params:
        kicker: Name the kind of future claim
        heading: Forecast, projection, or scenario?
        upto: 2
        by_beats: true
        rows:
          - {term: Forecast, basis: "current conditions", check: "can be scored"}
          - {term: Projection, basis: "a stated assumption", check: "depends on that assumption", tone: unknown}
          - {term: Scenario, basis: "a possible path", check: "has no assigned odds", tone: cool}

  - id: t4
    say: Forecasting joins past evidence to a model. Name the kind of future claim, state its assumptions, and show the spread of possible results.
    transition: dissolve
    scene:
      name: takeaway_line
      params: {text: "Name the future claim, its model and assumptions. Show the spread.", stop: 3, of: 5, label: The future}
    hold: 0.6

  # ================================================================ stop 5: the score
  - id: b5
    say: We now have a future claim with clear limits. The last step is to test many such claims.
    transition: dissolve
    scene:
      name: roadmap
      params: {kicker: "Stop 5 of 5", mode: travel, current: 4, stops: *stops}

  - id: k1
    say: The Brier score measures the gap between a forecast and what happened. Lower scores are better. A ninety-percent forecast earns a low cost when right and a high cost when wrong.
    sources: [S34, S33]
    transition: wipe
    beats: ["low cost", "high cost"]
    direction: Brier rhymes with higher.
    scene:
      name: bars
      params:
        kicker: The Brier score rewards careful odds
        heading: The cost of saying 90%
        max: 2
        decimals: 2
        items:
          - {label: "90% forecast, event happened", value: 0.02, tone: known}
          - {label: "90% forecast, event did not happen", value: 1.62, tone: warn}
          - {label: "The worst possible score", value: 2.0, tone: cool}

  - id: k2
    say: "One result may be luck. Many results reveal calibration. A calibrated set of seventy-percent forecasts comes true about seventy percent of the time."
    sources: [S34]
    transition: dissolve
    scene:
      name: calibration
      params:
        heading: Calibration compares stated odds with results
        points:
          - {x: 70, y: 70, label: "70% forecasts happen 70% of the time", tone: known}

  - id: k3
    say: People are often too sure. In studies reviewed in 1974, ranges that people said were ninety-eight percent certain missed the answer about thirty percent of the time.
    sources: [S32]
    transition: glide
    beats: ["reviewed in 1974", "thirty percent"]
    scene:
      name: bars
      params:
        heading: People said 98% sure but missed often
        max: 40
        unit: "%"
        items:
          - {label: "Expected misses", value: 2, tone: known}
          - {label: "Observed misses", value: 30, tone: warn}

  - id: t5
    say: One outcome cannot test a forecast. A long record of scored forecasts can.
    transition: dissolve
    scene:
      name: takeaway_line
      params: {text: "One outcome cannot test a forecast. A long scored record can.", stop: 4, of: 5, label: The test}
    hold: 0.6

  # ================================================================ zoom out
  - id: z1
    say: Name the group before giving a probability. Start with the base rate, then update it with new evidence. Use a range when evidence is thin. For a future claim, name the model and assumptions. Test your work across many forecasts.
    transition: dissolve
    direction: Bayes rhymes with days.
    scene:
      name: roadmap
      params:
        kicker: The complete path
        heading: From a group to a tested forecast
        mode: summary
        current: 5
        stops: *stops
    hold: 0.5

  - id: z2
    say: Return to the positive test. The answer begins with one thousand similar women, then uses the test result to update the base rate. That path leads to seven point eight percent.
    sources: [S59]
    transition: dissolve
    scene:
      name: icon_array
      params:
        heading: One thousand women, one test
        step: 2

  - id: z3
    say: Where does a probability come from? It comes from a named group and evidence that changes what we know. How do we test it? We score many forecasts, not one result.
    transition: dissolve
    scene:
      name: title_card
      params:
        label: The answer
        title: Name the group. Update with evidence.
        subtitle: State the limits. Score many forecasts.
    hold: 0.5

  - id: z4
    say: "Even a well-built number can fail after we say it. The final video asks whether the listener heard the same probability we meant."
    transition: dissolve
    scene:
      name: title_card
      params:
        label: Next question
        title: Did the listener hear what you meant?
        subtitle: A sound number can still be misunderstood
    hold: 0.8
