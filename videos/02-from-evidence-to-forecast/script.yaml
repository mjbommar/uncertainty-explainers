# Video 2 of Uncertainty Explainers. Shape from docs/STRUCTURE.md, video 2:
# opening question, claim, map, five stops (bridge in, vignette, takeaway), zoom out.
# Every factual segment cites keys in research/SOURCES.md. Numbers marked
# "(ours)" in storyboard.md are arithmetic on a source's own figures.
#
# The spine, written first.
#   Question: where does a probability come from, and how can you tell whether it is any good?
#   Claim: a probability is a summary of evidence, not a fact about the world.
#   1 The group    What is the number counting?       A probability counts over a group. Name the group, or the number floats.
#   2 The update   How should evidence move it?       Start from how common it is, then let the test move you. Rare things stay rare after one test.
#   3 The width    When is one number too many?       When evidence is thin, an honest summary is a range, not a point.
#   4 The future   What can it say about the future?  A forecast leans on the past and on a model. Say which kind of claim it is, and show the spread.
#   5 The score    How do we know it was good?        One outcome proves nothing. Many forecasts, scored, do.
slug: 02-from-evidence-to-forecast
title: From evidence to forecast
subtitle: What a probability is, and how to check one
target_seconds: 400
theme: ink
burn_captions: true
voice:
  model: gemini-3.1-flash-tts-preview
  voice: Enceladus
music:
  prompt: >-
    Calm, sparse documentary underscore. Warm felt piano with soft sustained pads,
    slow and reflective, no drums, no melody that competes with a voice.
  gain_db: -14
images:
  - id: patient
    prompt: a calm woman of about forty seated in a clinic waiting room chair, hands folded
  - id: test_result
    prompt: a single medical test result card on a clipboard, marked with a large plus sign
  - id: sunrise
    prompt: the sun half risen above a flat horizon line, with a few short rays
  - id: storm
    prompt: a heavy storm cloud with slanted rain lines
end_card:
  seconds: 3.5
  line: "Next: Saying it out loud"
  note: Uncertainty Explainers, video 3
segments:
  # ================================================================ pose the problem
  - id: open1
    say: A woman of forty goes for routine breast screening. The test comes back positive.
    sources: [S59]
    transition: dissolve
    beats: ["woman of forty", "positive"]
    scene:
      name: card_row
      params:
        kicker: One test result
        heading: Routine screening, a positive test
        cards:
          - {title: The patient, line: "A woman of forty", image: "image:patient"}
          - {title: The result, line: "Positive", tone: warn, image: "image:test_result"}

  - id: open2
    say: In a study reported in 1982, ninety-five of a hundred physicians put her chance of cancer at seventy to eighty percent.
    sources: [S59]
    transition: glide
    beats: ["seventy to eighty"]
    scene:
      name: interval_rows
      params: &doctors
        heading: Her chance of cancer, after a positive test
        axis_label: chance of cancer
        ticks: [{v: 0, label: "0%"}, {v: 0.25, label: "25%"}, {v: 0.5, label: "50%"}, {v: 0.75, label: "75%"}, {v: 1, label: "100%"}]
        rows:
          - {label: "95 of 100 physicians said", lo: 0.7, hi: 0.8, note: "70% to 80%", tone: warn}

  - id: open3
    say: The right answer is under eight percent. Same evidence, and a number ten times too big.
    sources: [S59]
    transition: cut
    beats: ["right answer", "under eight"]
    sfx:
      - {cue: soft_click, at: "under eight", gain_db: -8}
    scene:
      name: interval_rows
      params: &doctors_both
        heading: Her chance of cancer, after a positive test
        axis_label: chance of cancer
        steady: true
        ticks: [{v: 0, label: "0%"}, {v: 0.25, label: "25%"}, {v: 0.5, label: "50%"}, {v: 0.75, label: "75%"}, {v: 1, label: "100%"}]
        rows:
          - {label: "95 of 100 physicians said", lo: 0.7, hi: 0.8, note: "70% to 80%", tone: warn, shown: true}
          - {label: "The correct answer", lo: 0.078, hi: 0.078, note: "7.8%"}
    hold: 0.3

  - id: open4
    say: So where does a probability come from, and how can you tell whether it is any good?
    transition: dissolve
    scene:
      name: title_card
      params:
        label: From evidence to forecast
        title: Where does a probability come from?
        subtitle: And how can you tell whether it is any good?
    hold: 0.6

  # ================================================================ claim and map
  - id: claim
    say: A probability is a summary of evidence, not a fact about the world. So it can be built badly, it can claim too much, and it can be checked.
    transition: dissolve
    beats: ["summary of evidence", "built badly", "claim too much", "checked"]
    scene:
      name: card_row
      params:
        kicker: The claim
        heading: What a probability is
        cards:
          - {title: A summary, line: "Of evidence, not a fact about the world", tone: unknown}
          - {title: Built, line: "Well or badly, from a group and a test"}
          - {title: Stretched, line: "It can claim more than the evidence holds", tone: unknown}
          - {title: Checked, line: "It can be scored against what happened", tone: cool}
    hold: 0.6

  - id: map
    say: "Five stops: what the number counts, how evidence should move it, when one number is too many, what it says about the future, and how we know it was good."
    transition: dissolve
    scene:
      name: roadmap
      params:
        kicker: The route
        mode: overview
        current: -1
        stops: &stops
          - {label: The group, question: "What is the number counting?", takeaway: "Name the group, or the number floats."}
          - {label: The update, question: "How should evidence move it?", takeaway: "Start from the base rate; let evidence move it."}
          - {label: The width, question: "When is one number too many?", takeaway: "Thin evidence earns a range, not a point."}
          - {label: The future, question: "What can it say about the future?", takeaway: "Say what kind of claim; show the spread."}
          - {label: The score, question: "How do we know it was good?", takeaway: "One outcome proves nothing. Many, scored, do."}
    hold: 0.4

  # ================================================================ stop 1: the group
  - id: b1
    say: To see where the doctors went wrong, start with what the number counts.
    transition: dissolve
    scene:
      name: roadmap
      params: {kicker: "Stop 1 of 5", mode: travel, current: 0, stops: *stops}

  - id: g1
    say: Counting needs a reference class, the group you count over. The philosopher Alan Hájek is a man, a non-smoker and a philosophy professor. Each group gives a different chance that he lives to eighty.
    sources: [S15]
    transition: dissolve
    beats: ["reference class", "non-smoker", "philosophy professor"]
    direction: Say Hájek as HAH-yek.
    scene:
      name: card_row
      params:
        kicker: "The reference class: Alan Hájek's example"
        heading: Which group is he in?
        cards:
          - {title: Men, line: "One share of this group lives to 80"}
          - {title: Non-smokers, line: "A different share lives to 80", tone: unknown}
          - {title: Philosophy professors, line: "A third share lives to 80", tone: cool}

  - id: g2
    say: In 1814 Laplace counted five thousand years of sunrises, and put the odds of one more at nearly two million to one.
    sources: [S16]
    transition: dissolve
    beats: ["five thousand years", "nearly two million"]
    direction: Say Laplace as la-PLAHSS.
    scene:
      name: big_number
      params:
        value: 1826214
        suffix: " to 1"
        label: Laplace's odds that the sun rises tomorrow
        sub: counted over 1,826,213 days of recorded history
        image: "image:sunrise"

  - id: g3
    say: Anyone who knows what drives the days and seasons, he added, would put the odds far higher. Same sunrise, more evidence, a different number.
    sources: [S16]
    transition: push-left
    beats: ["he added", "far higher"]
    scene:
      name: two_column_compare
      params:
        heading: Same sunrise, two bodies of evidence
        left:
          title: The tally
          lines: ["Counts past sunrises", "Odds: 1,826,214 to 1"]
          tone: known
        right:
          title: The astronomer
          lines: ["Knows what drives days and seasons", "Odds: far higher"]
          tone: unknown

  - id: t1
    say: A probability counts over a group. Name the group, or the number floats.
    transition: dissolve
    scene:
      name: takeaway_line
      params: {text: "A probability counts over a group. Name the group, or the number floats.", stop: 0, of: 5, label: The group}
    hold: 0.6

  # ================================================================ stop 2: the update
  - id: b2
    say: The group matters. But the doctors had the right group, and missed.
    transition: dissolve
    scene:
      name: roadmap
      params: {kicker: "Stop 2 of 5", mode: travel, current: 1, stops: *stops}

  - id: u1
    say: Their error was how the test moved the number. Bayes' rule starts from the base rate, how common the disease is before any test.
    sources: [S21]
    transition: wipe
    beats: ["Bayes' rule", "base rate", "before any test"]
    direction: Bayes rhymes with days.
    scene:
      name: card_row
      params:
        kicker: Bayes' rule
        heading: How evidence moves a number
        cards:
          - {title: Base rate, line: "How common it is before the evidence", tone: unknown}
          - {title: The evidence, line: "How much more often it shows up when the claim is true"}
          - {title: The update, line: "What you should believe after", tone: cool}

  - id: u2
    say: Take a thousand women of forty in screening. Ten have breast cancer. That is the base rate.
    sources: [S59]
    transition: dissolve
    beats: ["thousand women", "Ten have"]
    scene:
      name: icon_array
      params:
        heading: One thousand women, one test
        step: 0

  - id: u3
    say: Eight of those ten test positive. Of the nine hundred and ninety without cancer, ninety-five also test positive.
    sources: [S59]
    transition: cut
    beats: ["Eight of those", "ninety-five"]
    sfx:
      - {cue: tick, at: "Eight of those", gain_db: -6}
    scene:
      name: icon_array
      params:
        heading: One thousand women, one test
        step: 1
        steady: true

  - id: u4
    say: So one hundred and three women test positive, and only eight of them have cancer. That is seven point eight percent.
    sources: [S59]
    transition: cut
    beats: ["one hundred and three", "only eight"]
    sfx:
      - {cue: chime, at: "seven point eight", gain_db: -8}
    scene:
      name: icon_array
      params:
        heading: One thousand women, one test
        step: 2
        steady: true
    hold: 0.4

  - id: u5
    say: The disease is rare, so most positives come from healthy women. The doctors left out the base rate, as earlier research found people do most of the time.
    sources: [S59]
    transition: dissolve
    beats: ["disease is rare", "left out"]
    scene:
      name: interval_rows
      params:
        heading: Where seventy percent came from
        axis_label: chance of cancer
        ticks: [{v: 0, label: "0%"}, {v: 0.25, label: "25%"}, {v: 0.5, label: "50%"}, {v: 0.75, label: "75%"}, {v: 1, label: "100%"}]
        rows:
          - {label: "Counted with the base rate", lo: 0.078, hi: 0.078, note: "7.8%"}
          - {label: "Base rate left out", lo: 0.7, hi: 0.8, note: "70% to 80%", tone: warn}

  - id: u6
    say: Counts help. In Gigerenzer and Hoffrage's 1995 study, correct answers rose from sixteen percent with percentages to about half with counts.
    sources: [S59]
    transition: glide
    beats: ["sixteen percent", "about half", "with counts"]
    direction: Say Gigerenzer as GIG-er-en-tser.
    scene:
      name: bars
      params:
        heading: People who reasoned correctly
        max: 100
        unit: "%"
        items:
          - {label: "Numbers given as percentages", value: 16, tone: warn}
          - {label: "Numbers given as counts, standard form", value: 46}
          - {label: "Numbers given as counts, short form", value: 50}

  - id: t2
    say: Start from how common it is, then let the test move you. Rare things stay rare after one test.
    transition: dissolve
    scene:
      name: takeaway_line
      params: {text: "Start from how common it is, then let the test move you. Rare things stay rare after one test.", stop: 1, of: 5, label: The update}
    hold: 0.6

  # ================================================================ stop 3: the width
  - id: b3
    say: Bayes gives one number, and for the test that was enough.
    transition: dissolve
    scene:
      name: roadmap
      params: {kicker: "Stop 3 of 5", mode: travel, current: 2, stops: *stops}

  - id: w1
    say: But one number can claim too much. A coin that landed heads in half of a hundred tosses gets one half. So may a coin never seen. Its honest summary is a range, zero to one.
    sources: [S23]
    transition: dissolve
    beats: ["A coin that", "never seen", "a range"]
    scene:
      name: interval_rows
      params:
        heading: Same number, different evidence
        then_beat: 2
        ticks: [{v: 0, label: "0"}, {v: 0.5, label: "1/2"}, {v: 1, label: "1"}]
        axis_label: chance of heads
        rows:
          - {label: "Coin tossed 100 times", lo: 0.5, hi: 0.5, note: "1/2"}
          - {label: "Coin never seen", lo: 0.5, hi: 0.5, note: "1/2", then: {lo: 0.0, hi: 1.0}, then_note: "0 to 1"}

  - id: w2
    say: Daniel Ellsberg's urn, from 1961, holds thirty red balls, and sixty black and yellow balls in an unknown mix.
    sources: [S77]
    transition: dissolve
    beats: ["urn, from 1961", "sixty black"]
    sfx:
      - {cue: marbles, at: "thirty red", gain_db: -6}
    scene:
      name: ellsberg_urn
      params:
        heading: Ellsberg's urn, 1961
        red: 30
        other: 60
        notes: ["30 red: known", "60 black or yellow: mix unknown"]

  - id: w3
    say: The chance of red is one third. The chance of black is anywhere from zero to two thirds.
    sources: [S23]
    transition: glide
    beats: ["chance of red", "chance of black"]
    scene:
      name: interval_rows
      params:
        heading: One urn, a dot and a range
        ticks: [{v: 0, label: "0"}, {v: 0.3333, label: "1/3"}, {v: 0.6667, label: "2/3"}, {v: 1, label: "1"}]
        axis_label: chance of drawing
        rows:
          - {label: Red, lo: 0.3333, hi: 0.3333, note: "1/3", tone: warn}
          - {label: Black, lo: 0.0, hi: 0.6667, note: "0 to 2/3", tone: unknown}

  - id: t3
    say: When evidence is thin, an honest summary is a range, not a point.
    transition: dissolve
    scene:
      name: takeaway_line
      params: {text: "When evidence is thin, an honest summary is a range, not a point.", stop: 2, of: 5, label: The width}
    hold: 0.6

  # ================================================================ stop 4: the future
  - id: b4
    say: A range is honest about today. A forecast reaches into tomorrow.
    transition: dissolve
    scene:
      name: roadmap
      params: {kicker: "Stop 4 of 5", mode: travel, current: 3, stops: *stops}

  - id: f1
    say: That claim leans on the past. In 1748 David Hume wrote that every conclusion from experience assumes the future will be like the past.
    sources: [S28]
    transition: dissolve
    beats: ["leans on the past", "David Hume", "like the past"]
    scene:
      name: induction_gap
      params:
        heading: The gap in induction
        count: 14
        past_label: every sunrise so far
        future_label: tomorrow
        gap_label: "assumed: the future will be like the past"

  - id: f2
    say: It also leans on a model. In 1963 Edward Lorenz showed that in a simple model of rising air, slightly different starts can grow into very different states.
    sources: [S43]
    transition: dissolve
    scene:
      name: divergence
      params:
        kicker: Sensitive to the start
        heading: Two runs, almost the same start
        paths: 2
        seed: 4
        growth: 5
        spread: 0.9
        start_label: nearly equal starts
        x_label: time

  - id: f3
    say: So Europe's main weather centre runs its model fifty times from slightly altered starts. When the runs agree, the weather is predictable. When they scatter, no firm forecast is possible.
    sources: [S44]
    transition: dissolve
    beats: ["fifty times", "runs agree", "scatter"]
    sfx:
      - {cue: whoosh, at: "fifty times", gain_db: -8}
    scene:
      name: spaghetti_plot
      params:
        heading: An ensemble, 50 altered runs and one control
        paths: 51
        seed: 5
        spread: 0.8
        x_label: days ahead
        start_label: now
        image: "image:storm"

  - id: f4
    say: A forecast starts from the present. A projection holds only if its assumption holds. And a scenario is a plausible story, with no probability attached.
    sources: [S46]
    transition: wipe
    beats: ["A forecast starts", "A projection", "a scenario"]
    scene:
      name: sort_table
      params:
        kicker: Conditional on what?
        heading: Three kinds of claim about the future
        upto: 2
        by_beats: true
        rows:
          - {term: Forecast, basis: "the present state", check: "yes, and scored"}
          - {term: Projection, basis: "an assumed path", check: "only in part", tone: unknown}
          - {term: Scenario, basis: "a plausible story", check: "no probability to check", tone: cool}

  - id: t4
    say: A forecast leans on the past and on a model. Say which kind of claim it is, and show the spread.
    transition: dissolve
    scene:
      name: takeaway_line
      params: {text: "A forecast leans on the past and on a model. Say which kind of claim it is, and show the spread.", stop: 3, of: 5, label: The future}
    hold: 0.6

  # ================================================================ stop 5: the score
  - id: b5
    say: So a forecast is a claim, and a claim can be graded.
    transition: dissolve
    scene:
      name: roadmap
      params: {kicker: "Stop 5 of 5", mode: travel, current: 4, stops: *stops}

  - id: k1
    say: The Brier score, from 1950, is the squared gap between forecast and outcome, and lower is better. In the Good Judgment Project, ninety percent cost zero point zero two if right, one point six two if wrong.
    sources: [S34, S33]
    transition: wipe
    beats: ["zero point zero two", "one point six two"]
    direction: Brier rhymes with higher.
    scene:
      name: bars
      params:
        kicker: The Brier score
        heading: What saying 90% costs
        max: 2
        decimals: 2
        items:
          - {label: "Said 90%, and it happened", value: 0.02, tone: known}
          - {label: "Said 90%, and it did not", value: 1.62, tone: warn}
          - {label: "The worst possible score", value: 2.0, tone: cool}

  - id: k2
    say: "One miss can be bad luck. Over many forecasts the scores show calibration: the events you call seventy percent should happen seventy percent of the time."
    sources: [S34]
    transition: dissolve
    scene:
      name: calibration
      params:
        heading: Calibration
        points:
          - {x: 70, y: 70, label: "Said 70%, happened 70%: calibrated", tone: known}

  - id: k3
    say: People often are not. In studies reviewed by Tversky and Kahneman in 1974, ranges given as ninety-eight percent sure missed about thirty percent of the time.
    sources: [S32]
    transition: glide
    beats: ["Tversky", "thirty percent"]
    scene:
      name: bars
      params:
        heading: Ranges given as 98% sure
        max: 40
        unit: "%"
        items:
          - {label: "How often they should miss", value: 2, tone: known}
          - {label: "How often they missed", value: 30, tone: warn}

  - id: t5
    say: One outcome proves nothing. Many forecasts, scored, do.
    transition: dissolve
    scene:
      name: takeaway_line
      params: {text: "One outcome proves nothing. Many forecasts, scored, do.", stop: 4, of: 5, label: The score}
    hold: 0.6

  # ================================================================ zoom out
  - id: z1
    say: A probability counts over a group, so name the group. Evidence moves it by Bayes' rule, so start from the base rate. But thin evidence earns a range. A forecast adds a model, so say what kind of claim it is, and show the spread. And none of it is trusted until it is scored.
    transition: dissolve
    direction: Bayes rhymes with days.
    scene:
      name: roadmap
      params:
        kicker: Where we have been
        heading: From evidence to forecast
        mode: summary
        current: 5
        stops: *stops
    hold: 0.5

  - id: z2
    say: Back to the positive test. Seven point eight percent counts a thousand women like her, moved by one test. It is one number because the evidence is good.
    sources: [S59]
    transition: dissolve
    scene:
      name: icon_array
      params:
        heading: One thousand women, one test
        step: 2

  - id: z3
    say: So where does a probability come from, and how can you tell whether it is any good? From a named group, moved by evidence. And by scoring many like it.
    transition: dissolve
    scene:
      name: title_card
      params:
        label: The answer
        title: A named group, moved by evidence
        subtitle: and scored, many times over
    hold: 0.5

  - id: z4
    say: "A scored number can still fail. The next video shows how: the listener hears a number other than the one you meant."
    transition: dissolve
    scene:
      name: title_card
      params:
        label: Uncertainty Explainers
        title: Said, and heard
        subtitle: A number is not shared until the listener holds it
    hold: 0.8
