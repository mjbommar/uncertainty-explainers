# Video 1 of the Uncertainty Explainers series. Shape: docs/STRUCTURE.md, "Video 1".
# Opening question (asked in s02, answered in the same words in s26):
#   "When someone says they do not know, what exactly is it they do not know,
#    and does the difference matter?"
# Takeaways, the spine (spoken and shown at the end of each stop):
#   1. Chance stays. Ignorance can be closed with data.                        (s08)
#   2. A number needs a group of similar cases. Without one, there is no number. (s14)
#   3. Where the odds are unknown, one number claims too much. People treat
#      that case differently, and so should a forecast.                       (s19)
#   4. Every forecast should first say where on the scale it stands.          (s22)
# Bridges: s05, s09, s15, s20 (roadmap, travel). Zoom-out: s23 to s27.
# Sources (research/SOURCES.md): S01 Der Kiureghian and Ditlevsen 2009; S56 van der Bles
# et al. 2019; S02 Knight 1921 (FRASER scan, Ch. VII, checked against the PDF text layer);
# S76 Knight 1921 Part I Ch. I (Econlib); S04 Keynes 1937; S77 Ellsberg 1961;
# S23 SEP Imprecise Probabilities; S09 Marchau et al. 2019; S08 Walker et al. 2003.
slug: 01-two-kinds-of-not-knowing
title: Not knowing comes in different forms
subtitle: Chance, missing facts, and honest numbers
target_seconds: 200
theme: ink
burn_captions: true
voice:
  model: gemini-3.1-flash-tts-preview
  voice: Enceladus
music:
  prompt: >-
    Calm, sparse documentary underscore. Warm felt piano with soft sustained pads,
    slow and reflective, no drums, no melody that competes with a voice.
  gain_db: -14
images:
  - id: die
    prompt: a single six-sided die, tilted to show three faces with pips
    provider: openai
    quality: medium
  - id: envelope
    prompt: a closed paper envelope sealed with a round wax seal
    provider: openai
    quality: medium
  - id: house
    prompt: a small simple house with a pitched roof and one door
    provider: openai
    quality: medium
  - id: venture
    prompt: a lightbulb with a small gear inside it, a new invention
    provider: openai
    quality: medium
  - id: roulette
    prompt: a roulette wheel seen from above
    provider: openai
    quality: medium
  - id: copper
    prompt: a small stack of three copper ingots
    provider: openai
    quality: medium
end_card:
  seconds: 3.2
  line: Name what you do not know before you name the odds.
  note: "Next: From evidence to forecast"
segments:
  # ---------------------------------------------------------------- pose the problem
  - id: s01
    say: 'Three people give the same answer: I do not know. One will roll a die. One holds a sealed envelope. One must guess the price of copper twenty years from now.'
    transition: dissolve
    beats: ["Three people", "sealed envelope", "price of copper"]
    scene:
      name: three_unknowns
      params:
        items: &people
          - {image: "image:die", caption: "The next roll of a die", tone: known}
          - {image: "image:envelope", caption: "A hidden number", tone: cool, tag: "?"}
          - {image: "image:copper", caption: "Copper's price in 20 years", tone: unknown}
    hold: 0.2

  - id: s02
    say: These people lack different things. What does each person not know? Why does that difference matter?
    transition: cut
    beats: ["What does each person"]
    scene:
      name: three_unknowns
      params:
        items: *people
        start: 3
        question: What does each person not know?
        question_at: 0
    hold: 0.35

  # ---------------------------------------------------------------- claim and map
  - id: s03
    say: 'Uncertainty means that we do not know something. Two questions help us sort it. Does chance create the gap, or are facts missing? Can evidence support a number?'
    sources: [S01, S76]
    transition: dissolve
    beats: ["Uncertainty means", "Does chance", "Can evidence"]
    scene:
      name: statement
      params:
        lines: ["What creates the gap?", "Chance or missing facts?", "Can evidence support a number?"]
        highlight: ["Chance or missing facts?", "Can evidence support a number?"]
    hold: 0.2

  - id: s04
    say: 'We will make four stops. First, chance or missing facts. Then, what we can measure. Next, unknown odds. Last, the range between certainty and total ignorance.'
    transition: glide
    scene:
      name: roadmap
      params:
        mode: overview
        current: -1
        stops: &stops
          - {label: Source of doubt, question: "Chance or missing facts?", takeaway: "Chance remains. Missing facts can be found."}
          - {label: A fair measure, question: "What can we count?", takeaway: "Odds need many similar cases."}
          - {label: Unknown odds, question: "What if the odds are unknown?", takeaway: "Unknown odds need a range."}
          - {label: The full scale, question: "How much can we know?", takeaway: "Place the forecast on the scale."}
    hold: 0.2

  # ---------------------------------------------------------------- stop 1: chance or ignorance?
  - id: s05
    say: 'Start with the die and the envelope. Both hide an answer, but they hide it in different ways.'
    transition: dip
    scene:
      name: roadmap
      params: {mode: travel, current: 0, stops: *stops}
    hold: 0.2

  - id: s06
    say: 'No amount of study can reveal the next roll. Chance creates this uncertainty. Researchers call it aleatory uncertainty.'
    sources: [S01]
    transition: dissolve
    beats: ["No amount of study", "aleatory uncertainty"]
    sfx:
      - prompt: A single six-sided plastic die rolled across a wooden table, tumbling and coming to rest. Clean studio recording, no music, no voice.
        duration: 1.2
        at: No amount of study
        gain_db: -6
    scene:
      name: object_cards
      params:
        heading: Chance creates the gap
        slots: 2
        items:
          - image: "image:die"
            term: Aleatory uncertainty
            caption: Chance remains after more study
            tone: known
            ticker: ["3", "6", "1", "4", "2", "5", "5", "1"]
            ticker_label: next roll
            at: 0
            term_at: 1
    hold: 0.2

  - id: s07
    say: 'The number in the envelope is already fixed. Opening it gives us the missing fact. Researchers call this epistemic uncertainty.'
    sources: [S01, S56]
    transition: dissolve
    beats: ["already fixed", "epistemic uncertainty"]
    sfx:
      - cue: paper
        at: Opening it
        gain_db: -8
    scene:
      name: object_cards
      params:
        heading: A missing fact creates the gap
        slots: 2
        start: 1
        items:
          - image: "image:die"
            term: Aleatory uncertainty
            caption: Chance remains after more study
            tone: known
            ticker: ["3", "6", "1", "4", "2", "5", "5", "1"]
            ticker_label: next roll
          - image: "image:envelope"
            term: Epistemic uncertainty
            caption: A fixed fact that we can learn
            tone: unknown
            stamp: "?"
            at: 0
            term_at: 1
    hold: 0.2

  - id: s08
    say: Chance remains. Missing facts can be found.
    sources: [S01]
    transition: glide
    scene:
      name: takeaway
      params:
        stop: What creates the gap?
        index: 0
        total: 4
        line: ["Chance remains.", "Missing facts can be found."]
    hold: 0.35

  # ---------------------------------------------------------------- stop 2: can it be measured?
  - id: s09
    say: We can find a missing fact, but we cannot remove chance. To give chance a number, we need many similar cases to count.
    transition: dip
    scene:
      name: roadmap
      params: {mode: travel, current: 1, stops: *stops}
    hold: 0.2

  - id: s10
    say: 'In 1921, Frank Knight used fire insurance as an example. One building may burn. Across many buildings, the insurer can measure how often fires occur.'
    sources: [S76, S02]
    transition: wipe
    beats: ["Frank Knight", "Across many buildings"]
    scene:
      name: object_cards
      params:
        heading: Fire insurance, Frank Knight, 1921
        slots: 2
        items:
          - image: "image:house"
            count: 24
            columns: 6
            marked: [9]
            term: Risk
            caption: Many buildings give us cases to count
            tone: known
            at: 0
            term_at: 1
    hold: 0.2

  - id: s11
    say: 'A new business has no long record of close matches. Knight called the first case risk. He called this second case true uncertainty.'
    sources: [S02, S76]
    transition: dissolve
    beats: ["new business", "risk", "true uncertainty"]
    scene:
      name: object_cards
      params:
        heading: Fire insurance, Frank Knight, 1921
        slots: 2
        start: 1
        items:
          - image: "image:house"
            count: 24
            columns: 6
            marked: [9]
            term: Risk
            caption: Many buildings give us cases to count
            tone: known
          - image: "image:venture"
            term: True uncertainty
            caption: One new business has no close group
            tone: unknown
            at: 0
            term_at: 2
    hold: 0.2

  - id: s12
    say: 'In 1937, John Maynard Keynes made the same split. Roulette has known odds. A future war or the price of copper twenty years later does not.'
    sources: [S04]
    transition: push-left
    direction: Say Keynes so it rhymes with canes.
    beats: ["Keynes", "future war", "price of copper"]
    sfx:
      - cue: soft_click
        at: future war
        gain_db: -10
    scene:
      name: sort_bins
      params:
        heading: Known odds and no sound odds, Keynes, 1937
        left: Known odds
        right: No sound odds
        items:
          - {text: Roulette, side: left, image: "image:roulette"}
          - {text: A European war, side: right}
          - {text: "Copper, 20 years out", side: right, image: "image:copper"}
    hold: 0.2

  - id: s13
    say: 'For those long-range questions, Keynes wrote that no scientific basis supported a calculation. His last sentence was plain. "We simply do not know."'
    sources: [S04]
    transition: dissolve
    direction: Leave a short pause before the last four words.
    sfx:
      - cue: low_pad
        at: 0.0
        gain_db: -12
    scene:
      name: quote_card
      params:
        text: There is no scientific basis on which to form any calculable probability whatever. We simply do not know.
        who: John Maynard Keynes
        when: "1937"
    hold: 0.35

  - id: s14
    say: 'Honest odds need many similar cases. Without them, no sound number exists.'
    sources: [S02, S76]
    transition: glide
    scene:
      name: takeaway
      params:
        stop: What can we measure?
        index: 1
        total: 4
        line: ["Honest odds need many similar cases.", "Without them, no sound number exists."]
    hold: 0.35

  # ---------------------------------------------------------------- stop 3: what if the odds are unknown?
  - id: s15
    say: 'Knight and Keynes drew a sharp line between measurable risk and uncertainty. Daniel Ellsberg studied a case between those ends.'
    transition: dip
    scene:
      name: roadmap
      params: {mode: travel, current: 2, stops: *stops}
    hold: 0.2

  - id: s16
    say: 'In 1961, Ellsberg described two urns. One holds fifty red and fifty black balls. The other holds one hundred balls in an unknown mix.'
    sources: [S77]
    transition: wipe
    beats: ["Ellsberg", "fifty red", "one hundred balls"]
    sfx:
      - cue: marbles
        at: fifty red
        gain_db: -7
    scene:
      name: urn
      params:
        heading: Two urns, Daniel Ellsberg, 1961
        left: {label: Urn I, total: 100, caption: "100 balls, mix unknown"}
        right: {label: Urn II, a: 50, b: 50, caption: "50 red, 50 black"}
    hold: 0.2

  - id: s17
    say: 'Most people prefer the urn with the known mix, whichever color wins the bet. This case is called ambiguity. We know the possible results, but not their odds.'
    sources: [S77, S23]
    transition: dissolve
    beats: ["Most people", "ambiguity", "possible results"]
    scene:
      name: range_bar
      params:
        heading: Ambiguity means unknown odds
        low_label: "0"
        high_label: "1"
        rows:
          - {label: "Known mix: chance of red", value: 50, value_label: "exactly ½", tone: known, at: 0}
          - {label: "Unknown mix: chance of red", lo: 0, hi: 100, value_label: "a range, not one number", tone: unknown, at: 1}
    hold: 0.2

  - id: s19
    say: 'Unknown odds call for a range. One exact number would claim more than the evidence supports.'
    sources: [S77, S23]
    transition: glide
    beats: ["Unknown odds", "One exact number"]
    scene:
      name: takeaway
      params:
        stop: What if the odds are unknown?
        index: 2
        total: 4
        line: ["Unknown odds call for a range.", "One exact number claims too much."]
        note: Match the answer to the strength of the evidence.
    hold: 0.35

  # ---------------------------------------------------------------- stop 4: where does mine sit?
  - id: s20
    say: 'Chance, missing facts, weak groups, and unknown odds do not fit into four separate boxes. They lie along a scale of what we can know.'
    transition: dip
    scene:
      name: roadmap
      params: {mode: travel, current: 3, stops: *stops}
    hold: 0.2

  - id: s21
    say: 'One end holds complete certainty. At the other end, we may not even know which questions we have missed.'
    sources: [S09, S08]
    transition: push-left
    beats: ["One end", "other end"]
    sfx:
      - cue: tick
        at: other end
        gain_db: -8
    scene:
      name: level_scale
      params:
        heading: How much can we know?
        levels:
          - {label: Complete certainty}
          - {label: Level 1}
          - {label: Level 2}
          - {label: Level 3}
          - {label: Level 4}
          - {label: Total ignorance, example: "unknown questions and unknown answers"}
        marks: [0, 5]
    hold: 0.3

  - id: s22
    say: Before giving odds, place the forecast on this scale. Tell the audience what the evidence can support.
    sources: [S09, S08]
    transition: glide
    sfx:
      - cue: chime
        at: place the forecast
        gain_db: -12
    scene:
      name: takeaway
      params:
        stop: How much can we know?
        index: 3
        total: 4
        line: ["Place the forecast on the scale.", "Say what the evidence can support."]
    hold: 0.35

  # ---------------------------------------------------------------- zoom out
  - id: s23
    say: 'Chance remains, while missing facts can be found. Honest odds need similar cases. When the odds are unknown, use a range. First place the forecast on the scale, then choose the number.'
    transition: dip
    scene:
      name: roadmap
      params: {mode: summary, current: 4, stops: *stops}
    hold: 0.2

  - id: s25
    say: 'Now return to the three people. The die has known odds but an unknown result. The envelope holds a fixed fact we can learn. Copper''s distant price has no sound odds.'
    sources: [S04]
    transition: dissolve
    beats: ["The die has", "The envelope holds", "Copper's distant"]
    scene:
      name: three_unknowns
      params:
        items: &verdicts
          - {image: "image:die", caption: "The next roll of a die", tone: known, verdict: "Known odds, unknown result"}
          - {image: "image:envelope", caption: "A hidden number", tone: cool, tag: "?", verdict: "A fixed fact we can learn"}
          - {image: "image:copper", caption: "Copper's price in 20 years", tone: unknown, verdict: "No sound odds"}
        start: 3
        verdict_at: 0
    hold: 0.2

  - id: s26
    say: 'What does each person not know? One lacks a future result. One lacks a fact. One lacks sound odds. The difference decides whether a number can help or mislead.'
    transition: cut
    beats: ["The difference decides"]
    scene:
      name: three_unknowns
      params:
        items: *verdicts
        start: 3
        verdict_at: -1
        question: Name what is unknown before you name the odds.
        question_at: 0
    hold: 0.35

  - id: s27
    say: 'Once we know the kind of uncertainty, we can ask what a number can honestly say.'
    transition: dissolve
    scene:
      name: statement
      params:
        lines: ["Next question:", "What can a number honestly say?"]
        note: "Next: From evidence to forecast"
    hold: 0.3
