# Video 1 of the Uncertainty Explainers series. Shape: docs/STRUCTURE.md, "Video 1".
# Opening question (asked in s02, answered in the same words in s26):
#   "When someone says they do not know, what exactly is it they do not know,
#    and does the difference matter?"
# Takeaways, the spine (spoken and shown at the end of each stop):
#   1. Chance stays. Ignorance can be closed with data.                        (s08)
#   2. A number needs a group of similar cases. Without one, there is no number. (s14)
#   3. Where the odds are unknown, one number claims too much. People treat
#      that case differently, and so should a forecast.                       (s19)
#   4. Every forecast should first say where on the scale it stands.          (s22)
# Bridges: s05, s09, s15, s20 (roadmap, travel). Zoom-out: s23 to s27.
# Sources (research/SOURCES.md): S01 Der Kiureghian and Ditlevsen 2009; S56 van der Bles
# et al. 2019; S02 Knight 1921 (FRASER scan, Ch. VII, checked against the PDF text layer);
# S76 Knight 1921 Part I Ch. I (Econlib); S04 Keynes 1937; S77 Ellsberg 1961;
# S23 SEP Imprecise Probabilities; S09 Marchau et al. 2019; S08 Walker et al. 2003.
slug: 01-two-kinds-of-not-knowing
title: Two kinds of not knowing
subtitle: Chance, ignorance, and what can be measured
target_seconds: 200
theme: ink
burn_captions: true
voice:
  model: gemini-3.1-flash-tts-preview
  voice: Enceladus
music:
  prompt: >-
    Calm, sparse documentary underscore. Warm felt piano with soft sustained pads,
    slow and reflective, no drums, no melody that competes with a voice.
  gain_db: -14
images:
  - id: die
    prompt: a single six-sided die, tilted to show three faces with pips
    provider: openai
    quality: medium
  - id: envelope
    prompt: a closed paper envelope sealed with a round wax seal
    provider: openai
    quality: medium
  - id: house
    prompt: a small simple house with a pitched roof and one door
    provider: openai
    quality: medium
  - id: venture
    prompt: a lightbulb with a small gear inside it, a new invention
    provider: openai
    quality: medium
  - id: roulette
    prompt: a roulette wheel seen from above
    provider: openai
    quality: medium
  - id: copper
    prompt: a small stack of three copper ingots
    provider: openai
    quality: medium
end_card:
  seconds: 3.2
  line: Name the kind of not knowing first.
  note: "Next: From evidence to forecast"
segments:
  # ---------------------------------------------------------------- pose the problem
  - id: s01
    say: 'Three people say, I do not know. One holds a die, one a sealed envelope. One is asked the price of copper in twenty years.'
    transition: dissolve
    beats: ["Three people", "sealed envelope", "price of copper"]
    scene:
      name: three_unknowns
      params:
        items: &people
          - {image: "image:die", caption: "A die, about to be rolled", tone: known}
          - {image: "image:envelope", caption: "A number, sealed inside", tone: cool, tag: "?"}
          - {image: "image:copper", caption: "Copper, twenty years out", tone: unknown}
    hold: 0.2

  - id: s02
    say: When someone says they do not know, what exactly is it they do not know, and does the difference matter?
    transition: cut
    beats: ["what exactly"]
    scene:
      name: three_unknowns
      params:
        items: *people
        start: 3
        question: What exactly do they not know, and does it matter?
        question_at: 0
    hold: 0.35

  # ---------------------------------------------------------------- claim and map
  - id: s03
    say: 'Uncertainty is not one thing. Two questions tell its kinds apart: chance or ignorance, and measurable or not.'
    sources: [S01, S76]
    transition: dissolve
    beats: ["Uncertainty", "chance or ignorance", "measurable or not"]
    scene:
      name: statement
      params:
        lines: ["Uncertainty is not one thing.", "Chance or ignorance?", "Measurable or not?"]
        highlight: ["Chance or ignorance?", "Measurable or not?"]
    hold: 0.2

  - id: s04
    say: 'Four stops: chance or ignorance, measurable or not, unknown odds, and where a case sits.'
    transition: glide
    scene:
      name: roadmap
      params:
        mode: overview
        current: -1
        stops: &stops
          - {label: Chance or ignorance, question: "Is it chance, or a gap in what we know?", takeaway: "Chance stays. Ignorance can be closed with data."}
          - {label: Can it be measured, question: "Is there a group of cases to count?", takeaway: "A number needs a group of similar cases."}
          - {label: Unknown odds, question: "What if the odds themselves are unknown?", takeaway: "Where odds are unknown, one number claims too much."}
          - {label: Where mine sits, question: "Where on the scale does a case sit?", takeaway: "Say first where on the scale you stand."}
    hold: 0.2

  # ---------------------------------------------------------------- stop 1: chance or ignorance?
  - id: s05
    say: 'Start with the die and the envelope, which fail for different reasons.'
    transition: dip
    scene:
      name: roadmap
      params: {mode: travel, current: 0, stops: *stops}
    hold: 0.2

  - id: s06
    say: 'More study of a die will not tell you the next roll. That is aleatory uncertainty.'
    sources: [S01]
    transition: dissolve
    beats: ["study of a die", "aleatory uncertainty"]
    sfx:
      - prompt: A single six-sided plastic die rolled across a wooden table, tumbling and coming to rest. Clean studio recording, no music, no voice.
        duration: 1.2
        at: study of a die
        gain_db: -6
    scene:
      name: object_cards
      params:
        heading: Chance or ignorance?
        slots: 2
        items:
          - image: "image:die"
            term: Aleatory
            caption: "Chance: more study will not tell the next roll"
            tone: known
            ticker: ["3", "6", "1", "4", "2", "5", "5", "1"]
            ticker_label: next roll
            at: 0
            term_at: 1
    hold: 0.2

  - id: s07
    say: 'The number in the envelope is already fixed. Open it and the doubt is gone. That is epistemic uncertainty.'
    sources: [S01, S56]
    transition: dissolve
    beats: ["already fixed", "epistemic uncertainty"]
    sfx:
      - cue: paper
        at: Open it
        gain_db: -8
    scene:
      name: object_cards
      params:
        heading: Chance or ignorance?
        slots: 2
        start: 1
        items:
          - image: "image:die"
            term: Aleatory
            caption: "Chance: more study will not tell the next roll"
            tone: known
            ticker: ["3", "6", "1", "4", "2", "5", "5", "1"]
            ticker_label: next roll
          - image: "image:envelope"
            term: Epistemic
            caption: "A fixed fact we do not know yet"
            tone: unknown
            stamp: "?"
            at: 0
            term_at: 1
    hold: 0.2

  - id: s08
    say: Chance stays. Ignorance can be closed with data.
    sources: [S01]
    transition: glide
    scene:
      name: takeaway
      params:
        stop: Chance or ignorance?
        index: 0
        total: 4
        line: ["Chance stays.", "Ignorance can be closed with data."]
    hold: 0.35

  # ---------------------------------------------------------------- stop 2: can it be measured?
  - id: s09
    say: So ignorance can shrink and chance cannot. But even chance needs something to count.
    transition: dip
    scene:
      name: roadmap
      params: {mode: travel, current: 1, stops: *stops}
    hold: 0.2

  - id: s10
    say: 'In 1921 Frank Knight pointed to fire insurance. Across many buildings, the loss evens out.'
    sources: [S76, S02]
    transition: wipe
    beats: ["Frank Knight", "many buildings"]
    scene:
      name: object_cards
      params:
        heading: Knight, 1921
        slots: 2
        items:
          - image: "image:house"
            count: 24
            columns: 6
            marked: [9]
            term: Risk
            caption: "Many buildings: the loss evens out"
            tone: known
            at: 0
            term_at: 1
    hold: 0.2

  - id: s11
    say: 'A new venture has no such group. Knight called the first kind risk, and the second true uncertainty.'
    sources: [S02, S76]
    transition: dissolve
    beats: ["new venture", "first kind risk", "true uncertainty"]
    scene:
      name: object_cards
      params:
        heading: Knight, 1921
        slots: 2
        start: 1
        items:
          - image: "image:house"
            count: 24
            columns: 6
            marked: [9]
            term: Risk
            caption: "Many buildings: the loss evens out"
            tone: known
          - image: "image:venture"
            term: True uncertainty
            caption: "One new venture: no group of cases"
            tone: unknown
            at: 0
            term_at: 2
    hold: 0.2

  - id: s12
    say: 'In 1937 John Maynard Keynes set roulette apart from a European war, or copper prices twenty years out.'
    sources: [S04]
    transition: push-left
    direction: Say Keynes so it rhymes with canes.
    beats: ["Keynes", "European war", "copper prices"]
    sfx:
      - cue: soft_click
        at: European war
        gain_db: -10
    scene:
      name: sort_bins
      params:
        heading: Keynes, 1937
        left: Not uncertain
        right: Uncertain
        items:
          - {text: Roulette, side: left, image: "image:roulette"}
          - {text: A European war, side: right}
          - {text: "Copper, 20 years out", side: right, image: "image:copper"}
    hold: 0.2

  - id: s13
    say: 'About these, he wrote, "there is no scientific basis on which to form any calculable probability whatever. We simply do not know."'
    sources: [S04]
    transition: dissolve
    direction: Leave a short pause before the last four words.
    sfx:
      - cue: low_pad
        at: 0.0
        gain_db: -12
    scene:
      name: quote_card
      params:
        text: There is no scientific basis on which to form any calculable probability whatever. We simply do not know.
        who: John Maynard Keynes
        when: "1937"
    hold: 0.35

  - id: s14
    say: 'A number needs a group of similar cases. Without one, there is none.'
    sources: [S02, S76]
    transition: glide
    scene:
      name: takeaway
      params:
        stop: Can it be measured?
        index: 1
        total: 4
        line: ["A number needs a group of similar cases.", "Without one, there is none."]
    hold: 0.35

  # ---------------------------------------------------------------- stop 3: what if the odds are unknown?
  - id: s15
    say: 'Knight and Keynes drew a hard line. Ellsberg tested the ground between.'
    transition: dip
    scene:
      name: roadmap
      params: {mode: travel, current: 2, stops: *stops}
    hold: 0.2

  - id: s16
    say: 'In 1961 Daniel Ellsberg offered two urns: a hundred red and black balls, mix unknown, or fifty of each.'
    sources: [S77]
    transition: wipe
    beats: ["Ellsberg", "a hundred red", "fifty of each"]
    sfx:
      - cue: marbles
        at: fifty of each
        gain_db: -7
    scene:
      name: urn
      params:
        heading: Ellsberg's two urns
        left: {label: Urn I, total: 100, caption: "100 balls, mix unknown"}
        right: {label: Urn II, a: 50, b: 50, caption: "50 red, 50 black"}
    hold: 0.2

  - id: s17
    say: 'Whichever color they bet on, most people pick fifty of each. No single chance of red fits that. This is ambiguity: outcomes known, odds not.'
    sources: [S77, S23]
    transition: dissolve
    beats: ["Whichever", "No single chance", "ambiguity"]
    scene:
      name: range_bar
      params:
        heading: Ambiguity
        low_label: "0"
        high_label: "1"
        rows:
          - {label: "Fifty of each: chance of red", value: 50, value_label: "exactly ½", tone: known, at: 0}
          - {label: "Mix unknown: chance of red", lo: 0, hi: 100, value_label: "no single number fits", tone: unknown, at: 1}
    hold: 0.2

  - id: s19
    say: 'Where the odds are unknown, one number claims too much. People treat that differently, and so should a forecast.'
    sources: [S77, S23]
    transition: glide
    beats: ["Where the odds", "People treat"]
    scene:
      name: takeaway
      params:
        stop: What if the odds are unknown?
        index: 2
        total: 4
        line: ["Where the odds are unknown,", "one number claims too much."]
        note: People treat that differently, and so should a forecast.
    hold: 0.35

  # ---------------------------------------------------------------- stop 4: where does mine sit?
  - id: s20
    say: 'Chance, ignorance, no group, unknown odds: these are points on one scale.'
    transition: dip
    scene:
      name: roadmap
      params: {mode: travel, current: 3, stops: *stops}
    hold: 0.2

  - id: s21
    say: 'At the far end of that scale, in one team''s words, "we do not even know that we do not know."'
    sources: [S09, S08]
    transition: push-left
    beats: ["far end", "we do not even"]
    sfx:
      - cue: tick
        at: far end
        gain_db: -8
    scene:
      name: level_scale
      params:
        heading: From certainty to total ignorance
        levels:
          - {label: Complete certainty}
          - {label: Level 1}
          - {label: Level 2}
          - {label: Level 3}
          - {label: Level 4}
          - {label: Total ignorance, example: "we do not even know that we do not know"}
        marks: [0, 5]
    hold: 0.3

  - id: s22
    say: So every forecast should first say where on the scale it stands.
    sources: [S09, S08]
    transition: glide
    sfx:
      - cue: chime
        at: every forecast
        gain_db: -12
    scene:
      name: takeaway
      params:
        stop: Where does mine sit?
        index: 3
        total: 4
        line: ["Every forecast should first say", "where on the scale it stands."]
    hold: 0.35

  # ---------------------------------------------------------------- zoom out
  - id: s23
    say: 'Chance stays and ignorance can be closed, so say which. But a number needs a group of cases, and where odds are unknown, one number claims too much. So say where on the scale you stand.'
    transition: dip
    scene:
      name: roadmap
      params: {mode: summary, current: 4, stops: *stops}
    hold: 0.2

  - id: s25
    say: 'The die is chance, with a number. The envelope is ignorance, with a number waiting. Copper has no honest number.'
    sources: [S04]
    transition: dissolve
    beats: ["The die is chance", "The envelope is ignorance", "Copper has"]
    scene:
      name: three_unknowns
      params:
        items: &verdicts
          - {image: "image:die", caption: "A die, about to be rolled", tone: known, verdict: "Chance: 1 in 6"}
          - {image: "image:envelope", caption: "A number, sealed inside", tone: cool, tag: "?", verdict: "Ignorance: a number waiting"}
          - {image: "image:copper", caption: "Copper, twenty years out", tone: unknown, verdict: "Far end: no honest number"}
        start: 3
        verdict_at: 0
    hold: 0.2

  - id: s26
    say: 'When someone says they do not know, what exactly they do not know is a chance, a fact, or something no one can count. The difference matters: it decides what a number can mean.'
    transition: cut
    beats: ["the difference matters"]
    scene:
      name: three_unknowns
      params:
        items: *verdicts
        start: 3
        verdict_at: -1
        question: The kind decides what any number can mean.
        question_at: 0
    hold: 0.35

  - id: s27
    say: 'The next question is what a number can honestly say.'
    transition: dissolve
    scene:
      name: statement
      params:
        lines: ["What can a number", "honestly say?"]
        note: "Next: From evidence to forecast"
    hold: 0.3
