status: ready for upload
title: Not knowing comes in different forms | Uncertainty Explainers 1
description: |
  Three people give the same answer: "I do not know." One will roll a die. One holds a sealed
  envelope. One must guess the price of copper twenty years from now. They lack different things,
  and the difference decides whether a number can help or mislead.

  Two questions sort uncertainty. Does chance create the gap, or are facts missing? Can evidence
  support a number? Four stops answer them: the die and the envelope (aleatory and epistemic
  uncertainty), Frank Knight's fire insurance and John Maynard Keynes's "We simply do not know"
  (risk and true uncertainty), Daniel Ellsberg's two urns (ambiguity, or unknown odds), and a scale
  from complete certainty to not knowing which questions we have missed.

  Next in the series: How evidence becomes a forecast.
chapters:
  - {segment: s01, title: Three people who do not know}
  - {segment: s03, title: Two questions and four stops}
