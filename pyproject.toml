[project]
name = "uncertainty-explainers"
version = "0.1.0"
description = "Animated video explainers on conceptions of uncertainty, built on bc-modules"
requires-python = ">=3.13"
dependencies = [
    "bc-core", "bc-content[pdf]", "bc-web[all]", "bc-research", "bc-llm[openai]",
    "bc-gen[google]", "bc-num", "bc-viz", "bc-signal", "bc-image", "bc-audio", "bc-motion",
    "pyyaml>=6.0", "numpy>=2.0", "pillow>=11", "matplotlib>=3.9", "pydantic>=2.9", "httpx>=0.27",
    "inflect>=7.5.0", "simplemma>=2.0.0",
]

[tool.uv.sources]
bc-core = { path = "../../bc/bc-modules/bc-core", editable = true }
bc-content = { path = "../../bc/bc-modules/bc-content", editable = true }
bc-web = { path = "../../bc/bc-modules/bc-web", editable = true }
bc-research = { path = "../../bc/bc-modules/bc-research", editable = true }
bc-llm = { path = "../../bc/bc-modules/bc-llm", editable = true }
bc-gen = { path = "../../bc/bc-modules/bc-gen", editable = true }
bc-num = { path = "../../bc/bc-modules/bc-num", editable = true }
bc-viz = { path = "../../bc/bc-modules/bc-viz", editable = true }
bc-signal = { path = "../../bc/bc-modules/bc-signal", editable = true }
bc-image = { path = "../../bc/bc-modules/bc-image", editable = true }
bc-audio = { path = "../../bc/bc-modules/bc-audio", editable = true }
bc-motion = { path = "../../bc/bc-modules/bc-motion", editable = true }

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["scripts", "research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E731", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]
known-third-party = ["bc_audio", "bc_core", "bc_gen", "bc_image", "bc_motion", "bc_signal", "bc_viz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
