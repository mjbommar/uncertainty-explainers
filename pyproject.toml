[project]
name = "uncertainty-explainers"
version = "0.1.0"
description = "Animated video explainers on conceptions of uncertainty, built on bc-modules"
requires-python = ">=3.13"
dependencies = [
    "bc-core", "bc-content", "bc-web[all]", "bc-research", "bc-llm",
    "bc-gen[google]", "bc-num", "bc-viz", "bc-signal", "bc-image", "bc-audio", "bc-motion",
    "pyyaml>=6.0", "numpy>=2.0", "pillow>=11", "matplotlib>=3.9", "pydantic>=2.9", "httpx>=0.27",
    "inflect>=7.5.0", "simplemma>=2.0.0",
]

[tool.uv.sources]
bc-core = { path = "../../bc/bc-modules/bc-core" }
bc-content = { path = "../../bc/bc-modules/bc-content" }
bc-web = { path = "../../bc/bc-modules/bc-web" }
bc-research = { path = "../../bc/bc-modules/bc-research" }
bc-llm = { path = "../../bc/bc-modules/bc-llm" }
bc-gen = { path = "../../bc/bc-modules/bc-gen" }
bc-num = { path = "../../bc/bc-modules/bc-num" }
bc-viz = { path = "../../bc/bc-modules/bc-viz" }
bc-signal = { path = "../../bc/bc-modules/bc-signal" }
bc-image = { path = "../../bc/bc-modules/bc-image" }
bc-audio = { path = "../../bc/bc-modules/bc-audio" }
bc-motion = { path = "../../bc/bc-modules/bc-motion" }

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
